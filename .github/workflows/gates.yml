name: gates

# One gate, one source of truth.
#
# This workflow does not restate the commands: it runs the same script a human and a
# runbook run (`scripts/agent-gates.sh --full`), so CI cannot drift from the local gate.
# If a command changes, it changes in that script and in RUNBOOK.md — in one commit.
#
# What it covers: ruff + dead code, the frontend lint/typecheck/build/test gate, the
# critical-path tests, the full backend suite in plain AND encrypted modes, the security
# checks, and the evidence-hygiene guard.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: lint, suites, security, evidence hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Materialise the env files the gate expects
        # `.env` and `.env.test` are gitignored because they hold config, so a clean
        # clone has neither and the compose test services will not start without them.
        # Everything written here is throwaway: the DB_KEY is random and encrypts a test
        # database that is created and discarded inside this runner. No real secret.
        run: |
          cp .env.example .env.test
          printf 'DB_KEY=\nRUNNING_IN_DOCKER=true\n' >> .env.test
          printf 'DB_KEY=%s\n' "$(openssl rand -hex 16)" > .env

      - name: Restore the PII denylist (gitignored by design)
        # The list of values to block is itself the disclosure, so it is a repo secret
        # rather than a file. With no secret the guard reports "no denylist" and passes —
        # correct, because it then has nothing to check against.
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: |
          if [ -n "$PII_DENYLIST" ]; then
            mkdir -p .agents
            printf '%s\n' "$PII_DENYLIST" > .agents/pii-denylist.txt
            echo "denylist restored"
          else
            echo "no PII_DENYLIST secret configured — the guard will report nothing to check"
          fi

      - name: Gates
        run: ./scripts/agent-gates.sh --full
