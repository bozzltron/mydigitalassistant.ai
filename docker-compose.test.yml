# A Compose project of its own, on purpose. Without `name:` this file joins the
# default project (`mydigitalassistantai`) — the same project as docker-compose.prod.yml
# — so the `down --remove-orphans` that run_ci.sh runs between stages removes the
# *production* containers. Measured 2026-10-27 (backlog B-15); it is why a gate run
# could take the site down and nobody noticed until :8444 was dead.
name: mydigitalassistantai-test

services:
  # Frontend tests (Node/Vitest)
  test-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend-test
    container_name: assistant-tests-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    command: npm run test
    user: root

  exam:
    build:
      context: .
      target: runtime
    container_name: assistant-exam
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env.test
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: root
    command: pytest assistant/tests/test_learning_exam.py -v

  # Critical-path tests: voice, run_now, correction, search extraction.
  # Must pass before the full suite.
  test-critical:
    build:
      context: .
      target: builder
    container_name: assistant-tests-critical
    working_dir: /app
    volumes:
      - .:/app
      - assistant-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/assistant-test-critical.db
      - DB_KEY=
    # `sh -c`, not a bare string. Compose parses a string `command:` as a list and
    # **drops everything after `&&`**: `pip install … && pytest …` resolved to
    # `[pip, install]`, so this service, test-plain and test-encrypted each ran pip and
    # exited 0. `run_ci.sh` then printed "All CI checks passed" having executed zero
    # backend tests. Measured 2026-11-01 (backlog B-08, t-7). A shell is the only way to
    # express a sequence here; keep the `&&` inside the quoted string.
    command: ["sh", "-c", 'pip install -e ".[dev]" && pytest assistant/tests/test_daily_schedule.py assistant/tests/test_review_fixes.py assistant/tests/test_extractor.py -q --tb=short']
    user: root

  # Runs the full test suite in plain (unencrypted) SQLite mode.
  test-plain:
    build:
      context: .
      target: builder
    container_name: assistant-tests-plain
    working_dir: /app
    volumes:
      - .:/app
      - assistant-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/assistant-test.db
      - DB_KEY=
    command: ["sh", "-c", 'pip install -e ".[dev]" && pytest assistant/tests/ -q --tb=short']
    user: root

  # Runs the full test suite in encrypted SQLCipher mode.
  # DB_KEY must be set; encrypted tests are skipped if it's absent.
  test-encrypted:
    build:
      context: .
      target: builder
    container_name: assistant-tests-encrypted
    working_dir: /app
    volumes:
      - .:/app
      - assistant-data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/assistant-test-encrypted.db
    command: ["sh", "-c", 'pip install -e ".[dev]" && pytest assistant/tests/ -q --tb=short']
    user: root

  dev:
    build: .
    container_name: assistant-dev
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_PATH=/app/data/assistant.db
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      - .:/app
      - assistant-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn assistant.backend.main:app --host 127.0.0.1 --port 8000 --reload

volumes:
  assistant-data:
    driver: local
  frontend-node-modules:
    driver: local
