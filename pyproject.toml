[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant"
version = "0.11.6"
description = "Privacy-first cognitive digital assistant with frame/slot memory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rich>=13.7",
    "numpy>=1.26",
    "sqlite-vec>=0.1.0",
    "aiosqlite>=0.20",
    # Encrypted brain (SQLCipher). Previously absent here, so `pip install -e .`
    # produced an install with no SQLCipher and therefore no encrypted DB.
    "sqlcipher3>=0.6.0",
    "cryptography>=42.0",
    # Local speech-to-text.
    "faster-whisper>=1.0",
    # Uploads (FastAPI's File/UploadFile).
    "python-multipart>=0.0.9",
    # Read support for user-supplied documents. All offline, pure-Python, no
    # system binaries: PDF, Word (.docx), Excel (.xlsx), PowerPoint (.pptx).
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "icalendar>=6.0",
    "striprtf>=0.0.26",
    "odfpy>=1.4",
    "xlrd>=2.0",
    "defusedxml>=0.7",
    # Write support for agent-authored files (the `write_file` tool). These are
    # runtime, not test, dependencies: the agent writes these formats on demand.
    # reportlab is pure-Python and offline, in the same family as the readers
    # above (see assistant/experiments/file_write_parity/result.md).
    "reportlab>=4.0",
    # Legacy Excel WRITER. xlrd only reads .xls; xlwt is what the agent needs to
    # author one. It was test-only (an .xls fixture) until write support arrived.
    "xlwt>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "sqlalchemy>=2.0",
]

[project.scripts]
assistant = "assistant.cli.app:main"
assistant-verify-security = "assistant.scripts.verify_security:main"

[tool.setuptools]
packages = [
    "assistant",
    "assistant.backend",
    "assistant.backend.api",
    "assistant.backend.db",
    "assistant.backend.memory",
    "assistant.backend.pipeline",
    "assistant.cli",
    "assistant.scripts",
]
package-dir = { assistant = "assistant" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "learning_exam: marks the E2E learning exam test (requires real Ollama + SearXNG; excluded from default runs)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# B008: FastAPI's Depends()/Query()/File() are intentionally called in defaults.
# UP042: (str, Enum) is kept where the enum must stay a plain str in JSON and
#        log formatting; StrEnum changes __str__/__format__.
ignore = ["B008", "UP042"]
