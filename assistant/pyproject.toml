[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant"
version = "0.1.0"
description = "Privacy-first cognitive digital assistant with frame/slot memory"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "rich>=13.7",
    "numpy>=1.26",
    "sqlite-vec>=0.1.0",
    "aiosqlite>=0.20",
    "sqlcipher3>=0.6.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
assistant = "assistant.cli.app:main"
assistant-verify-security = "assistant.scripts.verify_security:main"

[tool.setuptools]
packages = [
    "assistant",
    "assistant.backend",
    "assistant.backend.api",
    "assistant.backend.db",
    "assistant.backend.memory",
    "assistant.backend.pipeline",
    "assistant.cli",
    "assistant.scripts",
]
package-dir = { assistant = "." }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "learning_exam: marks the E2E learning exam test (requires real Ollama + SearXNG; excluded from default runs)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008"]
