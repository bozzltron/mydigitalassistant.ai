<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brain Observatory</title>
  <script src="/static/d3.min.js"></script>
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #06070d;
      --surface: #0d1117;
      --border: #1e2433;
      --text: #e6edf3;
      --text-dim: #7d8590;
      --accent: #58a6ff;
      --accent2: #3fb950;
      --error: #f47070;
      --warning: #d29922;
      --font: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, 'Courier New', monospace;
      --person: #f78166;
      --concept: #d2a8ff;
      --event: #79c0ff;
      --household: #7ee787;
      --entity: #ffa657;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .refresh-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.7rem;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .import-btn {
      cursor: pointer;
    }

    .status {
      font-size: 0.65rem;
      color: var(--text-dim);
    }

    .legend {
      display: flex;
      gap: 1rem;
      font-size: 0.6rem;
      color: var(--text-dim);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    #canvas-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #brain-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #brain-canvas-3d {
      position: absolute;
      inset: 0;
    }

    .refresh-btn.active {
      background: var(--primary);
      color: var(--bg);
    }

    .tooltip {
      position: absolute;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      max-width: 280px;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .tooltip.visible { opacity: 1; }

    .tooltip-name {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .tooltip-type {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.6;
      margin-bottom: 0.5rem;
    }

    .tooltip-meta {
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    .tooltip-slots {
      border-top: 1px solid var(--border);
      padding-top: 0.5rem;
      margin-top: 0.25rem;
    }

    .tooltip-slot {
      font-size: 0.7rem;
      margin-bottom: 0.25rem;
    }

    .tooltip-slot-key { color: var(--accent); }
    .tooltip-slot-val { color: var(--text); }
    .tooltip-slot-conf {
      color: var(--text-dim);
      font-size: 0.62rem;
      margin-left: 0.35rem;
    }

    .tooltip-conflicts { margin-top: 0.5rem; border-top: 1px solid var(--border); padding-top: 0.4rem; }
    .tooltip-conflicts-title { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--error); margin-bottom: 0.3rem; }
    .tooltip-conflict { margin-bottom: 0.45rem; }
    .tooltip-conflict-line { font-size: 0.7rem; margin-bottom: 0.25rem; }
    .tooltip-conflict-key { color: var(--accent); }
    .tooltip-conflict-old { color: var(--text-dim); text-decoration: line-through; }
    .tooltip-conflict-new { color: var(--warning); }
    .tooltip-conflict-actions { display: flex; gap: 0.3rem; }
    .tooltip-conflict-actions button {
      font-size: 0.62rem; padding: 2px 8px; cursor: pointer;
      background: transparent; color: var(--text);
      border: 1px solid var(--border); border-radius: 4px;
    }
    .tooltip-conflict-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .tooltip-conflict-actions button.use-new:hover { border-color: var(--warning); color: var(--warning); }

    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    .empty-state h2 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }

    .node {
      cursor: pointer;
    }

    .node circle {
      transition: r 0.2s;
    }

    .node:hover circle {
      filter: brightness(1.3);
    }

    .link {
      fill: none;
      stroke-opacity: 0.35;
      transition: stroke-opacity 0.2s, stroke-width 0.2s;
    }

    .link:hover {
      stroke-opacity: 0.9;
    }

    .link.dimmed { stroke-opacity: 0.06; marker-end: none; }
    .link.lit { stroke-opacity: 0.95; }

    .node.dimmed { opacity: 0.18; transition: opacity 0.2s; }
    /* Conflict nodes stay noticeable even while their neighborhood is dimmed. */
    .node.has-conflict.dimmed { opacity: 0.55; }
    .node.lit circle { filter: brightness(1.25); }

    .edge-label {
      font-size: 10px;
      fill: var(--text-dim);
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 3px;
      pointer-events: none;
      opacity: 0;
    }
    .edge-label.visible { opacity: 1; }

    .edge-legend {
      position: absolute;
      left: 1rem;
      bottom: 3.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      background: rgba(26, 29, 39, 0.85);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    .edge-legend .legend-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .edge-legend .legend-line {
      width: 18px;
      height: 0;
      border-top: 2px solid;
      border-radius: 2px;
    }

    nav {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      z-index: 10;
    }

    nav a {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.65rem;
      transition: all 0.2s;
    }

    nav a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Topic search */
    .topic-search {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .topic-search input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.72rem;
      padding: 0.38rem 0.6rem;
      width: 220px;
    }

    .topic-search input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .topic-panel {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(430px, 92vw);
      background: rgba(13, 17, 23, 0.97);
      border-left: 1px solid var(--border);
      z-index: 15;
      display: none;
      flex-direction: column;
      backdrop-filter: blur(6px);
    }

    .topic-panel.open { display: flex; }

    .topic-panel-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .topic-panel-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .topic-panel-title .kw-note { color: var(--warning); text-transform: none; letter-spacing: 0; }

    .topic-panel-close {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      cursor: pointer;
      display: inline-flex;
      padding: 0.3rem;
    }

    .topic-panel-close:hover { color: var(--text); border-color: var(--text-dim); }

    .topic-results {
      overflow-y: auto;
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .topic-empty {
      color: var(--text-dim);
      font-size: 0.75rem;
      line-height: 1.6;
      padding: 0.5rem 0.25rem;
    }

    .topic-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.8rem;
      background: var(--surface);
    }

    .topic-card-head {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.35rem;
    }

    .topic-card-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .topic-card-name { font-size: 0.82rem; font-weight: 700; }

    .topic-card-sim {
      margin-left: auto;
      font-size: 0.62rem;
      color: var(--accent2);
    }

    .topic-meta {
      font-size: 0.62rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    .conf-bar {
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.08);
      margin: 0.25rem 0 0.5rem;
      overflow: hidden;
    }

    .conf-bar > div { height: 100%; background: var(--accent); }

    .topic-section-title {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin: 0.55rem 0 0.3rem;
    }

    .topic-slot {
      font-size: 0.7rem;
      margin-bottom: 0.2rem;
      line-height: 1.5;
    }
    .topic-slot .k { color: var(--accent); }
    .topic-slot .c { color: var(--text-dim); font-size: 0.62rem; margin-left: 0.3rem; }

    .topic-assoc { font-size: 0.68rem; color: var(--text-dim); margin-bottom: 0.15rem; }
    .topic-assoc .rel { color: var(--concept); }

    .topic-episode {
      font-size: 0.66rem;
      color: var(--text-dim);
      border-left: 2px solid var(--border);
      padding-left: 0.5rem;
      margin-bottom: 0.35rem;
      line-height: 1.5;
    }
    .topic-episode .when { color: var(--accent2); }

    .topic-conflict-line { font-size: 0.68rem; margin-bottom: 0.2rem; }
    .topic-conflict-line .old { color: var(--text-dim); text-decoration: line-through; }
    .topic-conflict-line .new { color: var(--warning); }

    .conflict-pulse {
      animation: conflictPulse 1.5s ease-in-out infinite;
    }

    @keyframes conflictPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    .stats-bar {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      font-size: 0.6rem;
      color: var(--text-dim);
      z-index: 10;
      display: flex;
      gap: 1.5rem;
    }

    .stat-value {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="agent-name">Brain Observatory</h1>
    <div class="header-controls">
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--person)"></div>person</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--concept)"></div>concept</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--event)"></div>event</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--household)"></div>household</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--entity)"></div>entity</div>
      </div>
      <div class="status" id="status">Loading...</div>
      <div class="topic-search">
        <input type="text" id="topic-input" placeholder="Search memory by topic..." autocomplete="off">
        <button class="refresh-btn" id="topic-btn" title="Search memory for a topic">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>
      <button class="refresh-btn" onclick="loadData()">Refresh</button>
      <button class="refresh-btn" id="tour-btn" title="Auto-orbit tour" style="display:none">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><circle cx="12" cy="12" r="10"/><path d="M16.2 7.8l-2 6.3-6.4 2.1 2-6.3z"/></svg>
        Tour
      </button>
      <button class="refresh-btn" id="view-toggle" title="Toggle 2D / 3D view">3D</button>
      <button class="refresh-btn" id="export-btn" title="Export brain to JSON">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        Export
      </button>
      <label class="refresh-btn" style="cursor:pointer" title="Import brain from JSON">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
        Import
        <input type="file" id="import-input" accept=".json" style="display:none">
      </label>
    </div>
  </header>

  <div id="canvas-container">
    <svg id="brain-canvas"></svg>
    <div id="brain-canvas-3d" style="display:none"></div>
    <div class="tooltip" id="tooltip"></div>
    <div class="stats-bar" id="stats-bar"></div>
    <div class="edge-legend" id="edge-legend"></div>
    <nav>
      <a href="/chat-ui" target="_blank" rel="noopener">Back to Chat</a>
    </nav>
    <div class="topic-panel" id="topic-panel">
      <div class="topic-panel-header">
        <div class="topic-panel-title" id="topic-panel-title">Topic memory</div>
        <button class="topic-panel-close" id="topic-close" title="Close">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="topic-results" id="topic-results"></div>
    </div>
    <div class="empty-state" id="empty-state" style="display:none">
      <h2>No memories yet</h2>
      <p>Start chatting to build your brain</p>
    </div>
  </div>

  <script>
    const TYPE_COLORS = {
      person: '#f78166',
      concept: '#d2a8ff',
      event: '#79c0ff',
      household: '#7ee787',
      entity: '#ffa657',
    };

    // Edge colors by relation family. Generic relations render dimmest so
    // meaningful connections stand out in a hairball.
    const RELATION_GROUPS = [
      { re: /^(is_a|instance_of|type_of|part_of|has|subclass_of)$/, color: '#79c0ff', label: 'taxonomy / structure' },
      { re: /(located_in|based_in|place|city|country)/, color: '#7ee787', label: 'spatial' },
      { re: /(founded|follows|inquir|member|works_for|created|produced|wrote|compared|participation)/, color: '#f78166', label: 'social / agency' },
      { re: /(source|citation|reference|forecast|compare|lists)/, color: '#d2a8ff', label: 'informational' },
      { re: /^related_to$|^associated/, color: '#4a5470', label: 'related (generic)' },
    ];
    const FALLBACK_EDGE_COLOR = '#8b9bb8';

    function relationColor(relationType) {
      for (const g of RELATION_GROUPS) {
        if (g.re.test(relationType)) return g.color;
      }
      return FALLBACK_EDGE_COLOR;
    }

    function buildEdgeLegend() {
      const legend = document.getElementById('edge-legend');
      legend.innerHTML = RELATION_GROUPS
        .map(g => `<div class="legend-item"><div class="legend-line" style="border-color:${g.color}"></div>${g.label}</div>`)
        .join('');
    }

    function edgePath(d) {
      const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
      const dx = tx - sx, dy = ty - sy;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const cx = sx + dx / 2 - (dy / dist) * dist * 0.08;
      const cy = sy + dy / 2 + (dx / dist) * dist * 0.08;
      return `M${sx},${sy}Q${cx},${cy}${tx},${ty}`;
    }

    // True bezier apex: 0.25*P0 + 0.5*C + 0.25*P2 — labels sit ON the curve.
    function edgeMidpoint(d) {
      const sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
      const dx = tx - sx, dy = ty - sy;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const cx = sx + dx / 2 - (dy / dist) * dist * 0.08;
      const cy = sy + dy / 2 + (dx / dist) * dist * 0.08;
      return {
        x: (sx + 2 * cx + tx) / 4,
        y: (sy + 2 * cy + ty) / 4 + 3,
      };
    }

    const width = () => document.getElementById('canvas-container').clientWidth;
    const height = () => document.getElementById('canvas-container').clientHeight;

    let svg, g, simulation, nodes = [], links = [];
    let zoom; // d3 zoom behaviour, exposed for branch fit
    let neighbors = new Map(); // frameId -> Set(neighborIds)
    let highlightedFrameIds = new Set(); // persisted search highlight

    // ---- 3D view (Google-Earth-style fly-through) ----
    let mode = '2d';
    let graph3d = null;
    let touring = false;

    function hasWebGL() {
      try {
        const c = document.createElement('canvas');
        return !!(window.WebGLRenderingContext &&
          (c.getContext('webgl') || c.getContext('experimental-webgl')));
      } catch (e) { return false; }
    }

    function has3dLibs() {
      return typeof ForceGraph3D === 'function' && typeof THREE !== 'undefined';
    }

    function graphDataFor3d() {
      // Fresh copies: force engines mutate node/link objects (x/y/z, source
      // objectification), and the d3 scene owns the originals.
      return {
        nodes: nodes.map(n => ({ ...n })),
        links: links.map(l => ({
          source: l.source.id ?? l.source,
          target: l.target.id ?? l.target,
          relation_type: l.relation_type,
          confidence: l.confidence,
        })),
      };
    }

    function create3dStarfield(container) {
      // Reuse the same seeded-ish random starfield across modes.
      let starfield = container.querySelector('.starfield-3d');
      if (starfield) return;
      starfield = document.createElement('div');
      starfield.className = 'starfield-3d';
      starfield.style.position = 'absolute';
      starfield.style.inset = '0';
      starfield.style.pointerEvents = 'none';
      starfield.style.zIndex = '0';
      for (let i = 0; i < 200; i++) {
        const s = document.createElement('div');
        const size = Math.random() * 2 + 1;
        s.style.position = 'absolute';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.background = 'white';
        s.style.borderRadius = '50%';
        s.style.opacity = String(Math.random() * 0.4 + 0.1);
        starfield.appendChild(s);
      }
      container.appendChild(starfield);
    }

    function remove3dStarfield(container) {
      const starfield = container.querySelector('.starfield-3d');
      if (starfield) starfield.remove();
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function is3dHighlighted(nodeOrId) {
      if (highlightedFrameIds.size === 0) return true;
      const id = typeof nodeOrId === 'object' ? nodeOrId.id : nodeOrId;
      if (highlightedFrameIds.has(id)) return true;
      const nbrs = neighbors.get(id);
      if (!nbrs) return false;
      for (const hid of highlightedFrameIds) {
        if (nbrs.has(hid)) return true;
      }
      return false;
    }

    function nodeColor3d(d) {
      const base = TYPE_COLORS[d.type] || TYPE_COLORS.entity;
      if (highlightedFrameIds.size === 0 || is3dHighlighted(d)) return base;
      return hexToRgba(base, 0.18);
    }

    function linkColor3d(l) {
      const base = relationColor(l.relation_type);
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      if (highlightedFrameIds.size === 0 || is3dHighlighted(sid) || is3dHighlighted(tid)) return base;
      return hexToRgba(base, 0.12);
    }

    function dispose3D() {
      if (!graph3d) return;
      try {
        const ctrl = graph3d.controls();
        if (ctrl && typeof ctrl.dispose === 'function') ctrl.dispose();
        // _destructor is the three-render-objects cleanup hook.
        if (typeof graph3d._destructor === 'function') graph3d._destructor();
      } catch (e) {
        // ignore cleanup errors
      }
      graph3d = null;
      const el = document.getElementById('brain-canvas-3d');
      if (el) {
        el.innerHTML = '';
        remove3dStarfield(el);
      }
    }

    function init3D() {
      if (graph3d || !has3dLibs()) return;
      const el = document.getElementById('brain-canvas-3d');
      create3dStarfield(el);
      try {
        graph3d = ForceGraph3D()(el)
          .backgroundColor('rgba(0,0,0,0)')
          .showNavInfo(false)
          .nodeLabel(d => `${d.name} · ${d.type} · ${Math.round((d.confidence || 0.5) * 100)}%`)
          .nodeColor(nodeColor3d)
          .nodeVal(d => nodeRadius(d) / 2)
          .linkColor(linkColor3d)
          .linkWidth(l => Math.max(0.3, 1.5 * (l.confidence || 0.5)))
          .linkOpacity(0.45)
          .linkDirectionalArrowLength(3.5)
          .linkDirectionalArrowRelPos(1)
          .linkDirectionalParticles(l => ((l.confidence || 0.5) > 0.7 ? 2 : 0))
          .linkDirectionalParticleWidth(1.4)
          .onNodeClick(handle3dNodeClick);
        const ctrl = graph3d.controls();
        if (ctrl) ctrl.autoRotateSpeed = 0.6;
        if (graph3d.d3Force('charge')) graph3d.d3Force('charge').strength(-120);
        graph3d.width(width()).height(height());
      } catch (e) {
        console.error('3D graph initialization failed:', e);
        dispose3D();
        return;
      }
      // Safety fallback: if the renderer never appended its scene container, drop back to 2D.
      setTimeout(() => {
        if (mode === '3d' && el && !el.querySelector('.scene-container')) {
          console.warn('3D renderer did not initialize; falling back to 2D');
          dispose3D();
          setMode('2d');
        }
      }, 800);
    }

    function refresh3D() {
      if (graph3d && mode === '3d' && nodes.length) {
        graph3d.graphData(graphDataFor3d());
      }
    }

    async function handle3dNodeClick(node) {
      const tooltip = document.getElementById('tooltip');
      if (!node.slots) {
        const res = await fetch(`/memory/frames/${node.id}/slots`);
        node.slots = await res.json();
      }
      tooltip.innerHTML = tooltipHtml(node);
      const rect = document.getElementById('canvas-container').getBoundingClientRect();
      const p = graph3d.graph2ScreenCoords(node.x, node.y, node.z);
      let tx = p.x + 15;
      let ty = p.y - 10;
      if (tx + 280 > rect.width) tx = p.x - 295;
      tooltip.style.left = tx + 'px';
      tooltip.style.top = ty + 'px';
      tooltip.classList.add('visible');
    }

    function focusFrame(frameId) {
      const nbrs = neighbors.get(frameId) || new Set();
      if (mode === '3d' && graph3d) {
        const data = graph3d.graphData();
        const nd = data.nodes.find(n => n.id === frameId);
        if (!nd || nd.x == null) return;
        touring = false;
        const ctrl = graph3d.controls();
        if (ctrl) ctrl.autoRotate = false;
        document.getElementById('tour-btn').classList.remove('active');
        // Branch zoom: include neighbours in the camera target and distance.
        const branchNodes = [nd];
        for (const nid of nbrs) {
          const n = data.nodes.find(x => x.id === nid);
          if (n) branchNodes.push(n);
        }
        let cx = 0, cy = 0, cz = 0;
        for (const n of branchNodes) { cx += n.x; cy += n.y; cz += n.z; }
        cx /= branchNodes.length; cy /= branchNodes.length; cz /= branchNodes.length;
        let r = 0;
        for (const n of branchNodes) {
          const dx = n.x - cx, dy = n.y - cy, dz = n.z - cz;
          r = Math.max(r, Math.sqrt(dx*dx + dy*dy + dz*dz));
        }
        const dist = Math.max(70, r * 2.5 + 40);
        graph3d.cameraPosition(
          { x: cx + dist, y: cy + dist * 0.7, z: cz + dist },
          { x: cx, y: cy, z: cz },
          900
        );
      } else if (svg && zoom) {
        // 2D branch zoom: fit the active node plus neighbours into view.
        const branchIds = new Set(nbrs);
        branchIds.add(frameId);
        const branchNodes = nodes.filter(n => branchIds.has(n.id));
        if (branchNodes.length === 0) return;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const n of branchNodes) {
          minX = Math.min(minX, n.x);
          minY = Math.min(minY, n.y);
          maxX = Math.max(maxX, n.x);
          maxY = Math.max(maxY, n.y);
        }
        const pad = 80;
        const w = width(), h = height();
        const bw = maxX - minX + 2 * pad;
        const bh = maxY - minY + 2 * pad;
        const scale = Math.min(w / bw, h / bh, 4);
        const tx = w / 2 - scale * (minX + maxX) / 2;
        const ty = h / 2 - scale * (minY + maxY) / 2;
        svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
        if (window.__highlight2d) window.__highlight2d(frameId);
      }
    }

    function initCanvas() {
      const container = document.getElementById('canvas-container');
      svg = d3.select('#brain-canvas')
        .attr('width', width())
        .attr('height', height());

      const defs = svg.append('defs');

      const glow = defs.append('filter').attr('id', 'glow');
      glow.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'coloredBlur');
      const feMerge = glow.append('feMerge');
      feMerge.append('feMergeNode').attr('in', 'coloredBlur');
      feMerge.append('feMergeNode').attr('in', 'SourceGraphic');

      const strongGlow = defs.append('filter').attr('id', 'strongGlow');
      strongGlow.append('feGaussianBlur').attr('stdDeviation', '6').attr('result', 'coloredBlur');
      const feMerge2 = strongGlow.append('feMerge');
      feMerge2.append('feMergeNode').attr('in', 'coloredBlur');
      feMerge2.append('feMergeNode').attr('in', 'SourceGraphic');

      svg.append('rect')
        .attr('width', '100%')
        .attr('height', '100%')
        .attr('fill', 'var(--bg)');

      const stars = svg.append('g').attr('class', 'stars');
      for (let i = 0; i < 200; i++) {
        stars.append('circle')
          .attr('cx', Math.random() * width())
          .attr('cy', Math.random() * height())
          .attr('r', Math.random() * 0.8 + 0.2)
          .attr('fill', 'white')
          .attr('opacity', Math.random() * 0.4 + 0.1);
      }

      g = svg.append('g').attr('class', 'graph');

      zoom = d3.zoom()
        .scaleExtent([0.1, 4])
        .on('zoom', (event) => {
          g.attr('transform', event.transform);
        });

      svg.call(zoom);
    }

    async function loadData() {
      document.getElementById('status').textContent = 'Loading...';
      document.getElementById('empty-state').style.display = 'none';

      try {
        const [framesRes, assocRes, conflictsRes] = await Promise.all([
          fetch('/memory/frames'),
          fetch('/memory/associations'),
          fetch('/memory/conflicts'),
        ]);

        const frames = await framesRes.json();
        const associations = await assocRes.json();
        const conflicts = await conflictsRes.json();

        const pendingConflicts = conflicts.filter(c => c.status === 'pending');
        const conflictKeys = new Set(
          pendingConflicts.map(c => `${c.frame_id}-${c.slot_key}`)
        );
        const conflictsByFrame = {};
        for (const c of pendingConflicts) {
          (conflictsByFrame[c.frame_id] ||= []).push(c);
        }

        nodes = frames.map(f => ({
          ...f,
          type: f.type || 'entity',
          hasConflict: f.slots?.some(s => conflictKeys.has(`${f.id}-${s.key}`)) || false
        }));
        window.__conflictsByFrame = conflictsByFrame;

        links = associations
          .filter(a => a.from_frame_id && a.to_frame_id)
          .map(a => ({
            ...a,
            source: nodes.find(n => n.id === a.from_frame_id),
            target: nodes.find(n => n.id === a.to_frame_id)
          }))
          .filter(l => l.source && l.target);

        if (nodes.length === 0) {
          document.getElementById('empty-state').style.display = 'block';
          document.getElementById('status').textContent = 'No memories';
          document.getElementById('stats-bar').innerHTML = '';
          if (simulation) simulation.stop();
          g.selectAll('*').remove();
          if (graph3d) graph3d.graphData({ nodes: [], links: [] });
          return;
        }

        renderCurrent();
        updateStats();
        document.getElementById('status').textContent = 'Live';
      } catch (err) {
        console.error('Failed to load brain data:', err);
        document.getElementById('status').textContent = 'Error loading data';
      }
    }

    function renderGraph() {
      g.selectAll('*').remove();

      if (simulation) simulation.stop();

      simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(d => d.id).distance(100).strength(0.3))
        .force('charge', d3.forceManyBody().strength(-200))
        .force('center', d3.forceCenter(width() / 2, height() / 2))
        .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 8));

      simulation.alpha(1).restart();

      buildEdgeLegend();

      // Per-color arrowhead markers so directed edges read correctly.
      const defs = svg.select('defs');
      const edgeColors = [...new Set(links.map(l => relationColor(l.relation_type)))];
      for (const color of edgeColors) {
        const markerId = `arrow-${color.slice(1)}`;
        if (defs.select(`#${markerId}`).empty()) {
          defs.append('marker')
            .attr('id', markerId)
            .attr('viewBox', '0 -5 10 10')
            .attr('refX', 14)
            .attr('refY', 0)
            .attr('markerWidth', 5)
            .attr('markerHeight', 5)
            .attr('orient', 'auto')
            .append('path')
            .attr('d', 'M0,-5L10,0L0,5')
            .attr('fill', color);
        }
      }

      const link = g.append('g')
        .selectAll('path')
        .data(links)
        .join('path')
        .attr('class', 'link')
        .attr('stroke', d => relationColor(d.relation_type))
        .attr('stroke-width', d => {
          const conf = d.confidence || 0.5;
          return conf === 0.5 ? 1.25 : Math.max(0.75, 2.25 * conf);
        })
        .attr('marker-end', d => `url(#arrow-${relationColor(d.relation_type).slice(1)})`);

      link.append('title')
        .text(d => `${d.relation_type} (${Math.round((d.confidence || 0.5) * 100)}%)`);

      const edgeLabel = g.append('g')
        .selectAll('text')
        .data(links)
        .join('text')
        .attr('class', 'edge-label')
        .attr('text-anchor', 'middle')
        .text(d => d.relation_type);

      const node = g.append('g')
        .selectAll('g')
        .data(nodes)
        .join('g')
        .attr('class', d => d.hasConflict ? 'node has-conflict' : 'node')
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended));

      node.append('circle')
        .attr('r', d => nodeRadius(d))
        .attr('fill', d => TYPE_COLORS[d.type] || TYPE_COLORS.entity)
        .attr('filter', d => d.hasConflict ? 'url(#strongGlow)' : 'url(#glow)')
        .attr('class', d => d.hasConflict ? 'conflict-pulse' : '');

      node.append('title')
        .text(d => `${d.name} (${d.type})\nConfidence: ${Math.round((d.confidence || 0.5) * 100)}%`);

      simulation.on('tick', () => {
        link.attr('d', edgePath);
        edgeLabel
          .attr('x', d => edgeMidpoint(d).x)
          .attr('y', d => edgeMidpoint(d).y);

        node.attr('transform', d => `translate(${d.x},${d.y})`);
      });

      // Hover: light up the neighborhood, dim the rest, label its edges.
      neighbors = new Map();
      links.forEach(l => {
        if (!neighbors.has(l.source.id)) neighbors.set(l.source.id, new Set());
        if (!neighbors.has(l.target.id)) neighbors.set(l.target.id, new Set());
        neighbors.get(l.source.id).add(l.target.id);
        neighbors.get(l.target.id).add(l.source.id);
      });

      function highlightNeighbors(activeId) {
        const nbrs = neighbors.get(activeId) || new Set();
        link.classed('dimmed', l =>
          l.source.id !== activeId && l.target.id !== activeId)
          .classed('lit', l =>
            l.source.id === activeId || l.target.id === activeId);
        edgeLabel.classed('visible', l =>
          l.source.id === activeId || l.target.id === activeId);
        node.classed('dimmed', n =>
          n.id !== activeId && !nbrs.has(n.id))
          .classed('lit', n => nbrs.has(n.id));
      }

      function computeHighlightSet() {
        const lit = new Set();
        if (highlightedFrameIds.size === 0) return lit;
        for (const id of highlightedFrameIds) {
          lit.add(id);
          const nbrs = neighbors.get(id);
          if (nbrs) nbrs.forEach(n => lit.add(n));
        }
        return lit;
      }

      function applyHighlight(litIds) {
        if (litIds.size === 0) {
          clearHighlight();
          return;
        }
        link.classed('dimmed', l => !litIds.has(l.source.id) && !litIds.has(l.target.id))
          .classed('lit', l => litIds.has(l.source.id) || litIds.has(l.target.id));
        edgeLabel.classed('visible', l => litIds.has(l.source.id) || litIds.has(l.target.id));
        node.classed('dimmed', n => !litIds.has(n.id))
          .classed('lit', n => litIds.has(n.id));
      }

      function clearHighlight() {
        link.classed('dimmed', false).classed('lit', false);
        node.classed('dimmed', false).classed('lit', false);
        edgeLabel.classed('visible', false);
      }

      function updatePersistentHighlight() {
        applyHighlight(computeHighlightSet());
      }

      // Neighborhood flash, callable from topic-search fly-to in 2D mode.
      window.__highlight2d = (frameId) => {
        highlightNeighbors(frameId);
        setTimeout(updatePersistentHighlight, 2400);
      };

      node.on('mouseover', (event, d) => { highlightNeighbors(d.id); showTooltip(event, d); })
        .on('mouseout', () => { clearHighlight(); updatePersistentHighlight(); hideTooltip(); })
        .on('click', (event, d) => showTooltip(event, d));

      async function fetchSlots(d) {
        if (!d.slots) {
          const res = await fetch(`/memory/frames/${d.id}/slots`);
          d.slots = await res.json();
        }
        return d;
      }

      function showTooltip(event, d) {
        const tooltip = document.getElementById('tooltip');
        fetchSlots(d).then(() => {
          tooltip.innerHTML = tooltipHtml(d);
          tooltip.classList.add('visible');
        });

        const rect = document.getElementById('canvas-container').getBoundingClientRect();
        let tx = event.clientX - rect.left + 15;
        let ty = event.clientY - rect.top - 10;
        if (tx + 280 > rect.width) tx = event.clientX - rect.left - 295;
        tooltip.style.left = tx + 'px';
        tooltip.style.top = ty + 'px';
      }

      function hideTooltip() {
        document.getElementById('tooltip').classList.remove('visible');
      }

      // Escape memory-sourced text for HTML interpolation. Slot values and
      // names come from LLM extraction of user conversation — treat as input.
      async function resolveConflict(conflictId, value) {
        try {
          const res = await fetch(
            `/memory/conflicts/${conflictId}/resolve?value=${encodeURIComponent(value)}`,
            { method: 'POST' }
          );
          if (!res.ok) throw new Error(await res.text());
          hideTooltip();
          await loadData();
        } catch (e) {
          console.error('Conflict resolve failed:', e);
        }
      }

      function dragstarted(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }

      function dragended(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }

      updatePersistentHighlight();
    }

    function escAttr(value) {
      return String(value ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    // Escape memory-sourced text for HTML interpolation. Slot values and
    // names come from LLM extraction of user conversation — treat as input.
    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function resolveConflict(conflictId, value) {
      try {
        const res = await fetch(
          `/memory/conflicts/${conflictId}/resolve?value=${encodeURIComponent(value)}`,
          { method: 'POST' }
        );
        if (!res.ok) throw new Error(await res.text());
        document.getElementById('tooltip').classList.remove('visible');
        await loadData();
      } catch (e) {
        console.error('Conflict resolve failed:', e);
      }
    }
    window.resolveConflict = resolveConflict;
    window.escAttr = escAttr;

    // Shared tooltip body for the 2D and 3D renderers.
    function tooltipHtml(d) {
      const conf = Math.round((d.confidence || 0.5) * 100);
      const pri = Math.round((d.priority || 0.5) * 100);

      const slotsHtml = (d.slots || []).slice(0, 5).map(s => {
        const sConf = s.confidence != null ? Math.round(s.confidence * 100) : null;
        return `
        <div class="tooltip-slot">
          <span class="tooltip-slot-key">${esc(s.key)}:</span>
          <span class="tooltip-slot-val">${esc(s.value)}</span>
          ${sConf != null ? `<span class="tooltip-slot-conf" title="slot confidence">${sConf}%</span>` : ''}
        </div>
      `;
      }).join('');

      const frameConflicts = (window.__conflictsByFrame || {})[d.id] || [];
      const conflictsHtml = frameConflicts.map(c => `
        <div class="tooltip-conflict">
          <div class="tooltip-conflict-line">
            <span class="tooltip-conflict-key">${esc(c.slot_key)}</span>:
            <span class="tooltip-conflict-old">${esc(c.existing_value ?? '∅')}</span>
            →
            <span class="tooltip-conflict-new">${esc(c.new_value ?? '∅')}</span>
          </div>
          <div class="tooltip-conflict-actions">
            <button onclick="resolveConflict(${c.id}, '${escAttr(c.existing_value)}')">Keep ${esc(c.existing_value ?? 'old')}</button>
            <button class="use-new" onclick="resolveConflict(${c.id}, '${escAttr(c.new_value)}')">Use ${esc(c.new_value ?? 'new')}</button>
          </div>
        </div>
      `).join('');

      return `
        <div class="tooltip-name" style="color:${TYPE_COLORS[d.type] || TYPE_COLORS.entity}">${esc(d.name)}</div>
        <div class="tooltip-type">${d.type}</div>
        <div class="tooltip-meta">
          confidence: ${conf}% &nbsp;|&nbsp; priority: ${pri}%
          ${d.essential ? '&nbsp;|&nbsp; <span style="color:var(--warning)">essential</span>' : ''}
          ${d.hasConflict ? '&nbsp;|&nbsp; <span style="color:var(--error)">conflict</span>' : ''}
        </div>
        ${d.slots?.length ? `<div class="tooltip-slots">${slotsHtml}${d.slots.length > 5 ? `<div style="color:var(--text-dim)">+${d.slots.length - 5} more</div>` : ''}</div>` : ''}
        ${frameConflicts.length ? `<div class="tooltip-conflicts"><div class="tooltip-conflicts-title">Pending conflicts</div>${conflictsHtml}</div>` : ''}
      `;
    }

    function renderCurrent() {
      if (mode === '3d') {
        init3D();
        refresh3D();
      } else {
        renderGraph();
      }
    }

    function nodeRadius(d) {
      const base = 4;
      const conf = d.confidence || 0.5;
      return base + conf * 8;
    }

    function updateStats() {
      const types = {};
      nodes.forEach(n => { types[n.type] = (types[n.type] || 0) + 1; });
      const typeStr = Object.entries(types).map(([t, c]) => `${c} ${t}`).join(' · ');

      document.getElementById('stats-bar').innerHTML = `
        <span><span class="stat-value">${nodes.length}</span> nodes</span>
        <span><span class="stat-value">${links.length}</span> edges</span>
        ${typeStr ? `<span>${typeStr}</span>` : ''}
      `;
    }

    window.addEventListener('resize', () => {
      svg.attr('width', width()).attr('height', height());
      if (simulation) {
        simulation.force('center', d3.forceCenter(width() / 2, height() / 2));
        simulation.alpha(0.3).restart();
      }
      if (graph3d) graph3d.width(width()).height(height());
    });

    initCanvas();

    // ---- View mode wiring: 3D fly-through by default when available ----
    const viewToggle = document.getElementById('view-toggle');
    const tourBtn = document.getElementById('tour-btn');

    function setMode(next) {
      mode = next;
      localStorage.setItem('brain-view', mode);
      viewToggle.textContent = mode === '3d' ? '2D' : '3D';
      tourBtn.style.display = mode === '3d' ? '' : 'none';
      document.getElementById('brain-canvas-3d').style.display =
        mode === '3d' ? 'block' : 'none';
      document.getElementById('brain-canvas').style.display =
        mode === '3d' ? 'none' : '';
      if (mode !== '3d') {
        touring = false;
        dispose3D();
        renderGraph();
      } else {
        init3D();
        refresh3D();
      }
    }

    if (hasWebGL() && has3dLibs()) {
      viewToggle.addEventListener('click', () =>
        setMode(mode === '3d' ? '2d' : '3d'));
      tourBtn.addEventListener('click', () => {
        touring = !touring;
        if (graph3d) {
          const ctrl = graph3d.controls();
          if (ctrl) ctrl.autoRotate = touring;
        }
        tourBtn.classList.toggle('active', touring);
      });
      setMode(localStorage.getItem('brain-view') === '2d' ? '2d' : '3d');
    } else {
      viewToggle.style.display = 'none';
    }

    window.addEventListener('beforeunload', dispose3D);

    // Export brain
    document.getElementById('export-btn').addEventListener('click', async () => {
      try {
        const resp = await fetch('/brain/export', { method: 'POST' });
        if (!resp.ok) throw new Error('Export failed');
        const data = await resp.json();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        a.download = `brain-${ts}.json`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (e) {
        alert('Export failed: ' + e.message);
      }
    });

    // Import brain
    document.getElementById('import-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      let brainJson;
      try {
        brainJson = JSON.parse(text);
      } catch {
        alert('Invalid JSON file');
        return;
      }
      const mode = confirm(
        'Import mode:\n\nOK = Merge (keep existing memory, add from file)\nCancel = Overwrite (delete all memory and replace with file)\n\nOverwrite creates an automatic backup first.'
      ) ? 'merge' : 'overwrite';
      try {
        const resp = await fetch('/brain/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ brain_json: brainJson, mode }),
        });
        const result = await resp.json();
        if (!resp.ok) throw new Error(result.detail || 'Import failed');
        alert(
          `Import complete.\n` +
          `Frames: ${result.imported.frames}  Slots: ${result.imported.slots}\n` +
          `Associations: ${result.imported.associations}  Episodes: ${result.imported.episodes}`
        );
        loadData();
      } catch (e) {
        alert('Import failed: ' + e.message);
      }
      e.target.value = '';
    });

    // Load agent name
    fetch('/assistant/name')
      .then(r => r.json())
      .then(({ name }) => document.getElementById('agent-name').textContent = name)
      .catch(() => {});

    loadData();

    // Periodic refresh, but never while the user is mid-inspection — a
    // simulation restart would yank the graph out from under the tooltip.
    setInterval(() => {
      if (document.getElementById('tooltip').classList.contains('visible')) return;
      loadData();
    }, 30000);

    // ---- Topic memory search ----
    const topicInput = document.getElementById('topic-input');
    const topicBtn = document.getElementById('topic-btn');
    const topicPanel = document.getElementById('topic-panel');
    const topicResults = document.getElementById('topic-results');
    const topicTitle = document.getElementById('topic-panel-title');

    // DOM builder — memory-sourced text enters via textContent only (XSS-safe).
    function tEl(tag, className, text) {
      const n = document.createElement(tag);
      if (className) n.className = className;
      if (text != null) n.textContent = text;
      return n;
    }

    function frameNameById(id) {
      const n = nodes.find(x => x.id === id);
      return n ? n.name : `#${id}`;
    }

    function fmtTs(ts) {
      if (!ts) return '';
      const d = new Date(String(ts).replace(' ', 'T') + 'Z'); // sqlite UTC
      return isNaN(d) ? String(ts) : d.toLocaleString();
    }

    function confBar(pct) {
      const wrap = tEl('div', 'conf-bar');
      const fill = tEl('div');
      fill.style.width = Math.round((pct || 0.5) * 100) + '%';
      wrap.appendChild(fill);
      return wrap;
    }

    function renderMatch(m) {
      const card = tEl('div', 'topic-card');
      card.style.cursor = 'pointer';
      card.title = 'Fly to this memory';
      card.addEventListener('click', () => focusFrame(m.frame.id));
      const head = tEl('div', 'topic-card-head');
      const dot = tEl('div', 'topic-card-dot');
      dot.style.background = TYPE_COLORS[m.frame.type] || TYPE_COLORS.entity;
      head.appendChild(dot);
      head.appendChild(tEl('div', 'topic-card-name', m.frame.name));
      if (m.similarity != null) {
        head.appendChild(tEl('div', 'topic-card-sim',
          Math.round(m.similarity * 100) + '% match'));
      }
      card.appendChild(head);

      const meta = tEl(
        'div', 'topic-meta',
        `${m.frame.type} · confidence ${Math.round((m.frame.confidence || 0.5) * 100)}%`
        + ` · priority ${Math.round((m.frame.priority || 0.5) * 100)}%`
        + (m.frame.essential ? ' · essential' : '')
        + (m.similarity == null ? ' · keyword match' : '')
      );
      card.appendChild(meta);
      card.appendChild(confBar(m.frame.confidence));

      if ((m.slots || []).length) {
        card.appendChild(tEl('div', 'topic-section-title', 'Stored facts'));
        for (const s of m.slots) {
          const line = tEl('div', 'topic-slot');
          const k = tEl('span', 'k', s.key + ': ');
          line.appendChild(k);
          line.appendChild(document.createTextNode(s.value));
          if (s.confidence != null) {
            line.appendChild(tEl('span', 'c', Math.round(s.confidence * 100) + '%'));
          }
          if (s.last_strengthened_at) {
            line.appendChild(tEl('span', 'c', ' · last reinforced ' + fmtTs(s.last_strengthened_at)));
          }
          card.appendChild(line);
        }
      } else {
        card.appendChild(tEl('div', 'topic-section-title', 'Stored facts'));
        card.appendChild(tEl('div', 'topic-empty', 'Frame exists but no slot values captured.'));
      }

      if ((m.associations || []).length) {
        card.appendChild(tEl('div', 'topic-section-title', 'Connections'));
        for (const a of m.associations) {
          const other = a.from_frame_id === m.frame.id ? a.to_frame_id : a.from_frame_id;
          const dir = a.from_frame_id === m.frame.id ? '→' : '←';
          const pct = a.confidence != null ? ` (${Math.round(a.confidence * 100)}%)` : '';
          card.appendChild(tEl('div', 'topic-assoc',
            `${dir} ${a.relation_type} ${frameNameById(other)}${pct}`));
        }
      }

      if ((m.episodes || []).length) {
        card.appendChild(tEl('div', 'topic-section-title', 'Conversations that touched this'));
        for (const ep of m.episodes.slice(0, 4)) {
          const line = tEl('div', 'topic-episode');
          line.appendChild(tEl('span', 'when', fmtTs(ep.timestamp)));
          const digest = ep.content.length > 180 ? ep.content.slice(0, 180) + '…' : ep.content;
          line.appendChild(document.createTextNode(' — ' + digest));
          card.appendChild(line);
        }
      }

      if ((m.conflicts || []).length) {
        card.appendChild(tEl('div', 'topic-section-title', 'Pending conflicts'));
        for (const c of m.conflicts) {
          const line = tEl('div', 'topic-conflict-line');
          line.appendChild(tEl('span', 'k', c.slot_key + ': '));
          line.appendChild(tEl('span', 'old', c.existing_value ?? '∅'));
          line.appendChild(document.createTextNode(' → '));
          line.appendChild(tEl('span', 'new', c.new_value ?? '∅'));
          card.appendChild(line);
        }
      }
      return card;
    }

    function renderTopicResults(data) {
      topicResults.textContent = '';
      topicTitle.textContent =
        `${data.matches.length} ${data.matches.length === 1 ? 'memory' : 'memories'} for "${data.query}"`;
      highlightedFrameIds.clear();
      if (!data.semantic_search) {
        topicTitle.appendChild(tEl('span', 'kw-note', ' (semantic offline — keyword only)'));
      }
      if (!data.matches.length) {
        topicResults.appendChild(tEl('div', 'topic-empty',
          'Nothing stored about this yet. Try other phrasings — semantic search matches by meaning, keyword search by exact substring.'));
        updatePersistentHighlight();
        refresh3D();
        return;
      }
      for (const m of data.matches) {
        highlightedFrameIds.add(m.frame.id);
        topicResults.appendChild(renderMatch(m));
      }
      updatePersistentHighlight();
      refresh3D();
    }

    async function runTopicSearch() {
      const q = topicInput.value.trim();
      if (!q) {
        highlightedFrameIds.clear();
        updatePersistentHighlight();
        refresh3D();
        return;
      }
      topicBtn.disabled = true;
      topicResults.textContent = '';
      topicResults.appendChild(tEl('div', 'topic-empty', 'Searching memory…'));
      openTopicPanel();
      try {
        const res = await fetch('/memory/search?q=' + encodeURIComponent(q));
        if (!res.ok) throw new Error(await res.text());
        renderTopicResults(await res.json());
      } catch (e) {
        topicResults.textContent = '';
        topicResults.appendChild(tEl('div', 'topic-empty', 'Search failed: ' + e.message));
        highlightedFrameIds.clear();
        updatePersistentHighlight();
        refresh3D();
      } finally {
        topicBtn.disabled = false;
      }
    }

    function openTopicPanel() { topicPanel.classList.add('open'); }
    function closeTopicPanel() {
      topicPanel.classList.remove('open');
      highlightedFrameIds.clear();
      updatePersistentHighlight();
      refresh3D();
    }

    topicBtn.addEventListener('click', runTopicSearch);
    topicInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') runTopicSearch();
    });
    document.getElementById('topic-close').addEventListener('click', closeTopicPanel);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeTopicPanel();
    });
  </script>
</body>
</html>
