<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognitive Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242836;
      --border: #2e3347;
      --user-msg: #1e3a5f;
      --assistant-msg: #1a2420;
      --text: #e8e9ed;
      --text-dim: #8b8fa3;
      --accent: #5b9cf6;
      --accent2: #4ec9a0;
      --error: #f47070;
      --warning: #f0b97c;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .user-badge {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .voice-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .voice-btn:hover { background: var(--border); }
    .voice-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .settings-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.25rem;
    }

    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .msg {
      max-width: 80%;
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 0.9rem;
    }

    .msg-user {
      align-self: flex-end;
      background: var(--user-msg);
      border-bottom-right-radius: 2px;
    }

    .msg-assistant {
      align-self: flex-start;
      background: var(--assistant-msg);
      border-bottom-left-radius: 2px;
    }

    .msg-assistant .content img { max-width: 100%; border-radius: 4px; }
    .msg-assistant .content code {
      background: rgba(255,255,255,0.1);
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: 0.85em;
    }
    .msg-assistant .content pre {
      background: rgba(0,0,0,0.3);
      padding: 0.6rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0.4rem 0;
    }
    .msg-assistant .content pre code {
      background: none;
      padding: 0;
    }
    .msg-assistant .content a { color: var(--accent); }
    .msg-assistant .content ul, .msg-assistant .content ol {
      margin-left: 1.2rem;
    }
    .msg-assistant .content h1, .msg-assistant .content h2,
    .msg-assistant .content h3 { margin: 0.5rem 0 0.25rem; }

    .msg-sources {
      margin-top: 0.4rem;
      font-size: 0.78rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      padding-top: 0.35rem;
    }

    .msg-meta {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 0.2rem;
    }

    .sources-header {
      font-weight: 600;
      color: var(--accent2);
      display: block;
      margin-bottom: 0.2rem;
    }

    .sources-list {
      list-style: none;
      margin-top: 0.2rem;
    }

    .sources-list li {
      margin: 0.15rem 0;
    }

    .sources-list a { color: var(--accent); }

    #input-row {
      padding: 0.75rem 1rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    #input-row textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.6rem 0.8rem;
      font-family: var(--font);
      font-size: 0.9rem;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      line-height: 1.4;
    }

    #input-row textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    #send-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 0 1.1rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    #send-btn:hover { opacity: 0.85; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Trace panel */
    #trace-panel {
      width: 420px;
      border-left: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    #trace-panel.hidden { display: none; }

    .trace-header {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .trace-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1rem;
    }

    .trace-content {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      font-size: 0.78rem;
    }

    .trace-section {
      margin-bottom: 1rem;
    }

    .trace-label {
      color: var(--accent2);
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .trace-value {
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--bg);
      padding: 0.5rem;
      border-radius: 5px;
      border: 1px solid var(--border);
      max-height: 200px;
      overflow-y: auto;
    }

    /* Settings panel (slide-in) */
    #settings-panel {
      position: fixed;
      top: 0;
      right: -300px;
      width: 300px;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 100;
      transition: right 0.25s ease;
      padding: 1rem;
      overflow-y: auto;
    }

    #settings-panel.open { right: 0; }

    .settings-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-section {
      margin-bottom: 1.25rem;
    }

    .settings-section label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 0.35rem;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .toggle-label { font-size: 0.85rem; }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem;
      border-radius: 5px;
      font-size: 0.85rem;
    }

    /* Voice recording overlay */
    #voice-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    #voice-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .voice-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      min-width: 240px;
    }

    .voice-bubble h3 {
      font-size: 0.9rem;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }

    .voice-bubble.processing .pulse-ring {
      border-color: var(--warning);
      animation-duration: 2s;
    }

    .voice-bubble.processing .pulse-ring::after {
      background: var(--warning);
    }

    .voice-bubble.speaking .pulse-ring {
      border-color: var(--accent2);
      animation: none;
      opacity: 0.6;
    }

    .voice-bubble.speaking .pulse-ring::after {
      background: var(--accent2);
    }

    .pulse-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      margin: 0 auto 1rem;
      animation: pulse 1.2s infinite;
      position: relative;
    }

    .pulse-ring::after {
      content: '';
      position: absolute;
      inset: 8px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.5;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.7; }
    }

    .voice-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .voice-stop {
      background: var(--error);
      border: none;
      color: #fff;
      border-radius: 6px;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .voice-cancel {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Welcome / loading states */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--text-dim);
    }

    .welcome-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .welcome h2 {
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--text);
    }

    .welcome p { font-size: 0.85rem; }

    .loading-dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    /* Mic button in input row */
    #mic-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0 0.75rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    #mic-btn:hover { background: var(--border); }
    #mic-btn.recording { background: var(--error); border-color: var(--error); color: #fff; }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* Link preview cards (like iMessage/WhatsApp) */
    .preview-cards {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.3rem;
    }

    .preview-card {
      display: flex;
      gap: 0.6rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      transition: border-color 0.15s;
    }

    .preview-card:hover {
      border-color: var(--accent);
    }

    .preview-card-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--surface2);
    }

    .preview-card-img-placeholder {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 1.5rem;
    }

    .preview-card-body {
      flex: 1;
      min-width: 0;
      padding: 0.5rem 0.6rem 0.5rem 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.2rem;
    }

    .preview-card-site {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-card-title {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .preview-card-url {
      font-size: 0.7rem;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-card-loading {
      font-size: 0.75rem;
      color: var(--text-dim);
      padding: 0.3rem 0;
    }

    /* Inline og:image in message body */
    .msg-images {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }

    .msg-images a {
      display: block;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      max-width: 200px;
      text-decoration: none;
    }

    .msg-images img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
      background: var(--surface2);
    }

    .msg-images .img-site {
      padding: 0.3rem 0.5rem;
      font-size: 0.65rem;
      color: var(--text-dim);
      background: var(--surface2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

<header>
  <h1 id="agent-name">Cognitive Assistant</h1>
  <div class="header-right">
    <span class="user-badge" id="user-badge">Loading...</span>
    <button id="voice-mode-btn" class="voice-btn" title="Voice conversation mode">
      Voice
    </button>
    <button id="stop-speaking-btn" class="voice-btn" title="Stop speaking" style="display:none;">
      Stop
    </button>
    <button class="settings-btn" id="settings-toggle" title="Settings">&#9881;</button>
    <a href="/brain-ui" class="nav-link" title="Brain Observatory" style="color:var(--text-dim);text-decoration:none;font-size:0.8rem;padding:0.35rem 0.75rem;border:1px solid var(--border);border-radius:6px;">Brain</a>
  </div>
</header>

<div id="main">
  <div id="chat-area">
    <div id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">&#9658;</div>
        <h2>Ready to chat</h2>
        <p>Type a message below or click Voice to start hands-free.</p>
      </div>
    </div>

    <div id="input-row">
      <textarea id="msg-input" rows="1" placeholder="Type a message..."></textarea>
      <button id="mic-btn" title="Voice input"></button>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <div id="trace-panel">
    <div class="trace-header">
      <span>&#128200; Trace</span>
      <button class="trace-close" id="trace-close">&times;</button>
    </div>
    <div class="trace-content" id="trace-content">
      <div class="trace-section">
        <div class="trace-label">Task type</div>
        <div class="trace-value" id="trace-task-type">-</div>
      </div>
      <div class="trace-section">
        <div class="trace-label">Memory context</div>
        <div class="trace-value" id="trace-memory">-</div>
      </div>
      <div class="trace-section">
        <div class="trace-label">Citations</div>
        <div class="trace-value" id="trace-citations">-</div>
      </div>
    </div>
  </div>
</div>

<!-- Settings panel -->
<div id="settings-panel">
  <div class="settings-title">
    Settings
    <button class="settings-close" id="settings-close">&times;</button>
  </div>

  <div class="settings-section">
    <label>Voice settings</label>
    <div class="toggle-row">
      <span class="toggle-label">Read responses aloud</span>
      <input type="checkbox" id="tts-enabled" />
    </div>
    <div class="settings-section">
      <label for="voice-select">Voice</label>
      <select id="voice-select">
        <option value="">Loading voices...</option>
      </select>
    </div>
  </div>

  <div class="settings-section">
    <label>Interface</label>
    <div class="toggle-row">
      <span class="toggle-label">Show trace panel</span>
      <input type="checkbox" id="trace-visible" checked />
    </div>
  </div>
</div>

<!-- Voice recording overlay -->
<div id="voice-overlay">
  <div class="voice-bubble">
    <h3 id="voice-status" aria-live="polite" aria-atomic="true">Listening<span class="loading-dots"></span></h3>
    <div class="pulse-ring"></div>
    <div class="voice-actions">
      <button class="voice-stop" id="voice-stop">Stop</button>
      <button class="voice-cancel" id="voice-cancel">Cancel</button>
    </div>
  </div>
</div>

<script src="/static/marked.min.js"></script>
<script>
(function() {
  'use strict';

  // ---- State ----
  const state = {
    userId: null,
    sessionId: localStorage.getItem('session_id') || null,
    userName: '',
    messages: [],
    voiceMode: false,
    mediaRecorder: null,
    audioChunks: [],
    isRecording: false,
    lastCitations: [],
    ogCache: {},  // url -> {title, description, image, site_name}
  };

  // ---- DOM refs ----
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  const messagesEl = $('#messages');
  const msgInput = $('#msg-input');
  const sendBtn = $('#send-btn');
  const micBtn = $('#mic-btn');
  const userBadge = $('#user-badge');
  const tracePanel = $('#trace-panel');
  const traceTaskType = $('#trace-task-type');
  const traceMemory = $('#trace-memory');
  const traceCitations = $('#trace-citations');
  const voiceOverlay = $('#voice-overlay');
  const voiceStatus = $('#voice-status');
  const voiceStopBtn = $('#voice-stop');
  const voiceCancelBtn = $('#voice-cancel');
  const voiceModeBtn = $('#voice-mode-btn');
  const stopSpeakingBtn = $('#stop-speaking-btn');
  const settingsPanel = $('#settings-panel');
  const settingsToggle = $('#settings-toggle');
  const settingsClose = $('#settings-close');
  const ttsEnabled = $('#tts-enabled');
  const voiceSelect = $('#voice-select');
  const traceVisible = $('#trace-visible');

  // ---- Backend URL ----
  const BASE = window.location.origin;

  // ---- Helpers ----
  async function api(path, opts = {}) {
    const res = await fetch(BASE + path, opts);
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || 'Request failed');
    }
    return res.json();
  }

  async function fetchLinkPreviews(urls, containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;

    // Render placeholder cards first
    container.innerHTML = urls.map(u => {
      const hostname = new URL(u).hostname;
      return `<a href="${u}" target="_blank" rel="noopener" class="preview-card">
        <div class="preview-card-img-placeholder">&#128279;</div>
        <div class="preview-card-body">
          <div class="preview-card-site">${hostname}</div>
          <div class="preview-card-title">${u}</div>
          <div class="preview-card-url">${u}</div>
        </div>
      </a>`;
    }).join('');

    // Fetch OG metadata for each URL (up to 5)
    const toFetch = urls.slice(0, 5);
    const cards = await Promise.all(toFetch.map(async (url) => {
      if (state.ogCache[url]) {
        return { url, ...state.ogCache[url] };
      }
      try {
        const resp = await api(`/og-preview?url=${encodeURIComponent(url)}`);
        if (resp.found) {
          state.ogCache[url] = {
            title: resp.title || '',
            description: resp.description || '',
            image: resp.image || '',
            site_name: resp.site_name || '',
          };
          return { url, ...state.ogCache[url] };
        }
      } catch (e) {
        // Ignore fetch errors, fall back to plain card
      }
      return { url, found: false };
    }));

    // Re-render with fetched data
    container.innerHTML = urls.map((u, i) => {
      const card = cards[i] || {};
      const hostname = new URL(u).hostname;
      const siteName = card.site_name || hostname;
      const title = card.title || u;
      const img = card.image;

      if (img) {
        return `<a href="${u}" target="_blank" rel="noopener" class="preview-card">
          <img src="${img}" alt="" class="preview-card-img" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
          <div class="preview-card-img-placeholder" style="display:none">&#128279;</div>
          <div class="preview-card-body">
            <div class="preview-card-site">${siteName}</div>
            <div class="preview-card-title">${title}</div>
            <div class="preview-card-url">${hostname}</div>
          </div>
        </a>`;
      }
      return `<a href="${u}" target="_blank" rel="noopener" class="preview-card">
        <div class="preview-card-img-placeholder">&#128279;</div>
        <div class="preview-card-body">
          <div class="preview-card-site">${siteName}</div>
          <div class="preview-card-title">${title}</div>
          <div class="preview-card-url">${hostname}</div>
        </div>
      </a>`;
    }).join('');
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(role, content, meta = {}) {
    const welcome = $('#welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = `msg msg-${role}`;

    const contentDiv = document.createElement('div');
    contentDiv.className = 'content';
    contentDiv.innerHTML = marked.parse(content || '');
    div.appendChild(contentDiv);

    if (meta.task_type) {
      const metaEl = document.createElement('div');
      metaEl.className = 'msg-meta';
      metaEl.textContent = `type: ${meta.task_type}`;
      div.appendChild(metaEl);
    }

    // Render inline og:images in assistant message (search results only)
    if (role === 'assistant' && meta.ogData && meta.task_type === 'search') {
      const urlsWithImages = Object.entries(meta.ogData).filter(([, d]) => d && d.image);
      if (urlsWithImages.length > 0) {
        const imgsDiv = document.createElement('div');
        imgsDiv.className = 'msg-images';
        imgsDiv.innerHTML = urlsWithImages.map(([url, data]) => {
          const siteName = data.site_name || new URL(url).hostname;
          return `<a href="${url}" target="_blank" rel="noopener">
            <img src="${data.image}" alt="" loading="lazy" onerror="this.parentElement.remove()"/>
            <div class="img-site">${siteName}</div>
          </a>`;
        }).join('');
        div.appendChild(imgsDiv);
      }
    }

    messagesEl.appendChild(div);
    scrollBottom();

    // TTS
    if (role === 'assistant' && getSettings().ttsEnabled && content) {
      speak(content);
    }

    // Save to history
    state.messages.push({ role, content, ...meta });

    // Update trace panel
    if (meta.task_type) traceTaskType.textContent = meta.task_type;
    if (meta.memory_context) traceMemory.textContent = meta.memory_context.slice(0, 500) + (meta.memory_context.length > 500 ? '...' : '');

    // Citations in trace panel — only when present
    if (meta.citations && meta.citations.length > 0) {
      if (role === 'assistant') {
        state.lastCitations = meta.citations;
      }
      traceCitations.innerHTML = `<span class="sources-header">Sources:</span><div class="preview-cards" id="preview-cards-container"></div>`;
      fetchLinkPreviews(meta.citations, 'preview-cards-container');
    } else {
      traceCitations.textContent = '-';
    }

    return div;
  }

  function setLoading(loading) {
    sendBtn.disabled = loading;
    msgInput.disabled = loading;
    if (loading) {
      const div = document.createElement('div');
      div.className = 'msg msg-assistant';
      div.id = 'loading-msg';
      div.innerHTML = '<div class="content"><em>Thinking<span class="loading-dots"></span></em></div>';
      messagesEl.appendChild(div);
      scrollBottom();
    } else {
      const el = $('#loading-msg');
      if (el) el.remove();
    }
  }

  // ---- Settings (localStorage) ----
  function getSettings() {
    return {
      ttsEnabled: localStorage.getItem('tts_enabled') === 'true',
      voiceUri: localStorage.getItem('voice_uri') || '',
      traceVisible: localStorage.getItem('trace_visible') !== 'false',
      voiceMode: localStorage.getItem('voice_mode') === 'true',
    };
  }

  function saveSettings(s) {
    if ('ttsEnabled' in s) localStorage.setItem('tts_enabled', String(s.ttsEnabled));
    if ('voiceUri' in s) localStorage.setItem('voice_uri', s.voiceUri);
    if ('traceVisible' in s) localStorage.setItem('trace_visible', String(s.traceVisible));
    if ('voiceMode' in s) localStorage.setItem('voice_mode', String(s.voiceMode));
    applySettings();
  }

  function applySettings() {
    const s = getSettings();
    ttsEnabled.checked = s.ttsEnabled;
    traceVisible.checked = s.traceVisible;
    tracePanel.classList.toggle('hidden', !s.traceVisible);
    voiceModeBtn.classList.toggle('active', s.voiceMode);
  }

  // ---- Voice / TTS state machine ----
  const VoiceState = {
    IDLE: 'idle',
    LISTENING: 'listening',
    PROCESSING: 'processing',
    SPEAKING: 'speaking',
  };

  let voiceState = VoiceState.IDLE;
  let currentUtterance = null;
  let speakGeneration = 0;
  let bargeInGeneration = 0;

  // Audio analysis globals
  let mediaStream = null;
  let audioContext = null;
  let analyser = null;
  let silenceTimeout = null;
  let bargeInMonitorId = null;
  let recordingTimeoutId = null;
  let recordingStartTime = null;
  let loudFrameCount = 0;
  let silenceAfterLoud = false;
  const SILENCE_THRESHOLD = 0.08;
  const BARGE_IN_THRESHOLD = 0.14;
  const SILENCE_DURATION = 2200;
  const BARGE_IN_DURATION = 350;
  const MIN_RECORDING_MS = 800;
  const MIN_AUDIO_LEVEL = 0.05;
  const MIN_AUDIO_FRAMES = 6;
  const MAX_RECORDING_MS = 30000;

  function setVoiceState(newState, reason = '') {
    const oldState = voiceState;
    if (oldState === newState) return;
    voiceState = newState;

    // Update overlay and UI
    voiceOverlay.classList.toggle('active', newState !== VoiceState.IDLE);
    micBtn.classList.toggle('recording', newState === VoiceState.LISTENING);

    const bubble = voiceOverlay.querySelector('.voice-bubble');
    if (bubble) {
      bubble.classList.remove('listening', 'processing', 'speaking');
      if (newState !== VoiceState.IDLE) {
        bubble.classList.add(newState);
      }
    }

    switch (newState) {
      case VoiceState.IDLE:
        voiceStatus.textContent = '';
        stopSpeakingBtn.style.display = 'none';
        break;
      case VoiceState.LISTENING:
        voiceStatus.textContent = 'Listening';
        stopSpeakingBtn.style.display = 'none';
        break;
      case VoiceState.PROCESSING:
        voiceStatus.textContent = 'Thinking...';
        stopSpeakingBtn.style.display = 'none';
        break;
      case VoiceState.SPEAKING:
        voiceStatus.textContent = 'Speaking';
        stopSpeakingBtn.style.display = 'inline-block';
        break;
    }
  }

  // ---- Audio feedback (earcons) ----
  function playEarcon(type) {
    if (!window.AudioContext && !window.webkitAudioContext) return;
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      const now = ctx.currentTime;
      if (type === 'start') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1760, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'stop') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1760, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'error') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      setTimeout(() => ctx.close(), 300);
    } catch (e) {
      // ignore
    }
  }

  function populateVoices() {
    const voices = speechSynthesis.getVoices();
    const localVoices = voices.filter(v => !v.url); // local voices only
    voiceSelect.innerHTML = '';
    if (localVoices.length === 0) {
      voiceSelect.innerHTML = '<option value="">No local voices found</option>';
      return;
    }
    const settings = getSettings();

    // Prefer known good voices (order matters)
    const preferredNames = [
      'Samantha',        // macOS US English
      'Google US English',
      'Microsoft Aria',   // Windows
      'Alex',            // macOS US English male
      'Karen',           // macOS Australian English
      'Victoria',        // macOS UK English
      'Moira',           // macOS Irish English
    ];

    let defaultIndex = -1;
    if (!settings.voiceUri) {
      // Try to find a preferred voice
      for (let i = 0; i < localVoices.length; i++) {
        const name = localVoices[i].name;
        if (preferredNames.some(p => name.includes(p))) {
          defaultIndex = i;
          break;
        }
      }
      if (defaultIndex === -1) defaultIndex = 0;
    }

    localVoices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = v.voiceURI;
      opt.textContent = `${v.name} (${v.lang})`;
      if (settings.voiceUri && v.voiceURI === settings.voiceUri) opt.selected = true;
      if (!settings.voiceUri && i === defaultIndex) opt.selected = true;
      voiceSelect.appendChild(opt);
    });
    if (!settings.voiceUri && defaultIndex >= 0) {
      saveSettings({ voiceUri: localVoices[defaultIndex].voiceURI });
    }
  }

  function speak(text) {
    if (!window.speechSynthesis) {
      // No TTS available; if in voice mode, go straight back to listening
      if (state.voiceMode) startListeningForVoice();
      return;
    }

    // Strip markdown links, URLs, and formatting
    let plain = text
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')  // [text](url) -> text
      .replace(/https?:\/\/\S+/g, '')              // URLs
      .replace(/www\.\S+/g, '')                    // www URLs
      .replace(/[#*`_\[\]]/g, '')                 // markdown chars
      .replace(/\n+/g, ' ')
      .trim();
    if (!plain) {
      if (state.voiceMode) startListeningForVoice();
      return;
    }

    const wasVoiceMode = state.voiceMode;
    if (wasVoiceMode) {
      setVoiceState(VoiceState.SPEAKING, 'tts starting');
      stopBargeInMonitor();
      startBargeInMonitor();
    }

    const gen = ++speakGeneration;
    speechSynthesis.cancel();

    const s = getSettings();
    const voices = speechSynthesis.getVoices();
    const voice = voices.find(v => v.voiceURI === s.voiceUri) || voices[0];
    if (!voice) {
      if (wasVoiceMode) startListeningForVoice();
      return;
    }

    const u = new SpeechSynthesisUtterance(plain);
    u.voice = voice;
    u.rate = 1.1;
    u.pitch = 1.0;
    currentUtterance = u;
    const myGen = gen;
    u.onstart = () => {
      if (myGen !== speakGeneration) return;
      if (wasVoiceMode) setVoiceState(VoiceState.SPEAKING, 'tts started');
    };
    u.onend = u.onerror = () => {
      stopSpeakingBtn.style.display = 'none';
      stopBargeInMonitor();
      if (myGen !== speakGeneration) return;
      currentUtterance = null;
      if (state.voiceMode) {
        startListeningForVoice();
      } else {
        setVoiceState(VoiceState.IDLE, 'tts finished, voice mode off');
      }
    };
    speechSynthesis.speak(u);
  }

  function stopSpeaking() {
    if (window.speechSynthesis) {
      speechSynthesis.cancel();
    }
    currentUtterance = null;
  }

  // Start listening for voice input (in voice mode)
  function startListeningForVoice() {
    if (!state.voiceMode) return;
    setVoiceState(VoiceState.LISTENING, 'start listening');
    playEarcon('start');
    stopSpeaking();
    stopBargeInMonitor();
    startRecording();
  }

  function enterVoiceMode() {
    state.voiceMode = true;
    saveSettings({ voiceMode: true });
    playEarcon('start');
    startListeningForVoice();
  }

  function exitVoiceMode() {
    state.voiceMode = false;
    saveSettings({ voiceMode: false });
    speakGeneration++;   // invalidate pending TTS callbacks
    bargeInGeneration++; // invalidate pending barge-in callbacks
    stopBargeInMonitor();
    stopSpeaking();
    stopRecording();
    setVoiceState(VoiceState.IDLE, 'exit voice mode');
  }

  function isVoiceExitCommand(text) {
    const t = text.toLowerCase().trim();
    return /^(stop listening|exit voice mode|stop voice mode|goodbye|bye)$/.test(t);
  }

  // ---- Chat ----
  async function sendMessage(text) {
    if (!text.trim() || !state.userId) return;
    if (state.sessionId) {
      localStorage.setItem('session_id', state.sessionId);
    }

    addMessage('user', text);
    msgInput.value = '';
    setLoading(true);

    try {
      const resp = await api('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: state.userId,
          message: text,
          session_id: state.sessionId,
        }),
      });

      state.sessionId = resp.session_id;
      localStorage.setItem('session_id', resp.session_id);

      // Pre-fetch OG previews for inline images (up to 4)
      const citations = resp.citations || [];
      const ogData = {};
      if (citations.length > 0) {
        const toFetch = citations.slice(0, 4);
        await Promise.all(toFetch.map(async (url) => {
          if (state.ogCache[url]) {
            ogData[url] = state.ogCache[url];
          } else {
            try {
              const r = await api(`/og-preview?url=${encodeURIComponent(url)}`);
              if (r.found) {
                state.ogCache[url] = { title: r.title, description: r.description, image: r.image, site_name: r.site_name };
                ogData[url] = state.ogCache[url];
              }
            } catch (_) {}
          }
        }));
      }

      addMessage('assistant', resp.response, {
        task_type: resp.task_type,
        memory_context: resp.memory_context,
        citations: citations,
        ogData: ogData,
      });

      // Voice mode: if TTS is disabled, resume listening manually.
      // If TTS is enabled, speak() will transition back to listening on TTS end.
      if (state.voiceMode && !getSettings().ttsEnabled && !state.isRecording) {
        startListeningForVoice();
      }
    } catch (err) {
      addMessage('assistant', `Error: ${err.message}`);
      if (state.voiceMode && !getSettings().ttsEnabled) {
        startListeningForVoice();
      }
    } finally {
      setLoading(false);
    }
  }

  // ---- Voice input (MediaRecorder + /transcribe) ----

  async function startRecording() {
    if (state.isRecording) return;
    try {
      // Close any existing audio context first to avoid multiple mic streams
      if (audioContext) {
        await audioContext.close().catch(() => {});
      }

      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
      });

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      const source = audioContext.createMediaStreamSource(mediaStream);
      source.connect(analyser);

      state.mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm' });
      state.audioChunks = [];

      state.mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          state.audioChunks.push(e.data);
        }
      };

      state.mediaRecorder.onstop = async () => {
        if (state.audioChunks.length === 0) {
          if (state.voiceMode) scheduleListenRetry("Didn't catch that");
          return;
        }
        const elapsed = Date.now() - (recordingStartTime || Date.now());
        const tooShort = elapsed < MIN_RECORDING_MS;
        const notEnoughLoud = loudFrameCount < MIN_AUDIO_FRAMES;
        if (tooShort || notEnoughLoud) {
          if (state.voiceMode) scheduleListenRetry("Didn't catch that");
          return;
        }
        const blob = new Blob(state.audioChunks, { type: 'audio/webm' });
        state.audioChunks = [];
        await sendAudioForTranscription(blob);
      };

      state.mediaRecorder.onerror = (e) => {
        console.error('MediaRecorder error:', e);
        if (state.voiceMode) scheduleListenRetry('Recording error');
      };

      state.mediaRecorder.start();
      state.isRecording = true;
      recordingStartTime = Date.now();
      loudFrameCount = 0;
      silenceAfterLoud = false;

      // Start monitoring audio levels
      monitorAudioLevels();

      // Auto-stop after max duration
      recordingTimeoutId = setTimeout(() => {
        if (state.isRecording) stopRecording();
      }, MAX_RECORDING_MS);
    } catch (e) {
      console.warn('Failed to start recording:', e);
      addMessage('assistant', 'Microphone access denied or not available. Voice mode paused.');
      if (state.voiceMode) {
        state.voiceMode = false;
        saveSettings({ voiceMode: false });
        setVoiceState(VoiceState.IDLE, 'mic permission denied');
      }
    }
  }

  function monitorAudioLevels() {
    if (voiceState !== VoiceState.LISTENING || !analyser) return;

    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(dataArray);

    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
      sum += dataArray[i];
    }
    const average = sum / dataArray.length / 255;
    const elapsed = Date.now() - (recordingStartTime || Date.now());
    const metMinDuration = elapsed >= MIN_RECORDING_MS;
    const hasLoudAudio = average >= MIN_AUDIO_LEVEL;

    if (hasLoudAudio) {
      loudFrameCount++;
      silenceAfterLoud = false;
      if (silenceTimeout) {
        clearTimeout(silenceTimeout);
        silenceTimeout = null;
      }
    } else {
      if (!silenceAfterLoud && loudFrameCount > 0) {
        silenceAfterLoud = true;
      }
      if (!silenceTimeout && metMinDuration && loudFrameCount >= MIN_AUDIO_FRAMES) {
        silenceTimeout = setTimeout(() => {
          if (state.isRecording) stopRecording();
        }, SILENCE_DURATION);
      }
    }

    if (voiceState === VoiceState.LISTENING) {
      requestAnimationFrame(monitorAudioLevels);
    }
  }

  function stopRecording() {
    if (!state.isRecording || !state.mediaRecorder) return;
    clearTimeout(recordingTimeoutId);
    recordingTimeoutId = null;
    if (silenceTimeout) {
      clearTimeout(silenceTimeout);
      silenceTimeout = null;
    }
    try {
      state.mediaRecorder.stop();
    } catch (e) {
      console.warn('Error stopping recorder:', e);
    }
    if (mediaStream) {
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
    }
    if (audioContext) {
      audioContext.close().catch(() => {});
      audioContext = null;
      analyser = null;
    }
    state.isRecording = false;
    recordingStartTime = null;
    loudFrameCount = 0;
    silenceAfterLoud = false;
  }

  function startBargeInMonitor() {
    stopBargeInMonitor();
    if (!analyser) return;
    const gen = ++bargeInGeneration;
    let consecutiveLoudFrames = 0;
    const requiredFrames = Math.ceil(BARGE_IN_DURATION / 16); // ~60fps

    function tick() {
      if (gen !== bargeInGeneration) return;
      if (voiceState !== VoiceState.SPEAKING || !analyser) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      const average = sum / dataArray.length / 255;

      if (average > BARGE_IN_THRESHOLD) {
        consecutiveLoudFrames++;
        if (consecutiveLoudFrames >= requiredFrames) {
          // Barge-in detected: cancel TTS and start listening
          speakGeneration++;
          stopSpeaking();
          stopBargeInMonitor();
          playEarcon('stop');
          startListeningForVoice();
          return;
        }
      } else {
        consecutiveLoudFrames = 0;
      }

      bargeInMonitorId = requestAnimationFrame(tick);
    }

    bargeInMonitorId = requestAnimationFrame(tick);
  }

  function stopBargeInMonitor() {
    if (bargeInMonitorId) {
      cancelAnimationFrame(bargeInMonitorId);
      bargeInMonitorId = null;
    }
  }

  function scheduleListenRetry(message, delayMs = 1200) {
    setVoiceState(VoiceState.PROCESSING, message);
    setTimeout(() => {
      if (state.voiceMode) {
        startListeningForVoice();
      }
    }, delayMs);
  }

  async function sendAudioForTranscription(blob) {
    if (!state.voiceMode) return;
    setVoiceState(VoiceState.PROCESSING, 'transcribing');
    playEarcon('stop');

    try {
      const formData = new FormData();
      formData.append('file', blob, 'audio.webm');

      const res = await fetch(BASE + '/transcribe', {
        method: 'POST',
        body: formData,
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: 'Transcription failed' }));
        throw new Error(err.detail || 'Transcription failed');
      }

      const data = await res.json();
      const text = (data.text || '').trim();

      if (!text) {
        scheduleListenRetry("Didn't catch that");
        return;
      }

      if (isVoiceExitCommand(text)) {
        exitVoiceMode();
        return;
      }

      sendMessage(text);
    } catch (err) {
      console.error('Transcription error:', err);
      scheduleListenRetry('Transcription error');
    }
  }

  // ---- Init ----
  async function init() {
    // Load agent name
    try {
      const { name } = await api('/assistant/name');
      document.getElementById('agent-name').textContent = name;
      if (name) document.title = name;
    } catch (_) {}

    // Load users
    try {
      const users = await api('/users');
      if (users.length === 0) {
        userBadge.textContent = 'No user — create one via CLI';
      } else {
        const savedUserId = localStorage.getItem('user_id');
        const user = savedUserId
          ? users.find(u => u.id === parseInt(savedUserId)) || users[0]
          : users[0];
        state.userId = user.id;
        state.userName = user.name;
        localStorage.setItem('user_id', user.id);
        userBadge.textContent = user.name;
      }
    } catch (e) {
      userBadge.textContent = 'Error loading user';
    }

    // TTS voices
    if (window.speechSynthesis) {
      speechSynthesis.onvoiceschanged = populateVoices;
      populateVoices();
    }

    // Apply settings
    applySettings();

    // Restore voice mode if it was active before reload
    if (getSettings().voiceMode && state.userId) {
      enterVoiceMode();
    }

    // Restore session messages from memory
    // (we don't store full history in localStorage, just reload via conversation)

    // Events
    sendBtn.addEventListener('click', () => sendMessage(msgInput.value));
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(msgInput.value);
      }
    });

    micBtn.addEventListener('click', () => {
      if (state.isRecording) {
        stopRecording();
      } else if (state.voiceMode) {
        // Voice mode is active; force a fresh listen cycle
        startListeningForVoice();
      } else {
        // Mic button enters continuous voice mode
        enterVoiceMode();
      }
    });

    voiceModeBtn.addEventListener('click', () => {
      if (state.voiceMode) {
        exitVoiceMode();
      } else {
        enterVoiceMode();
      }
    });

    stopSpeakingBtn.addEventListener('click', () => {
      stopSpeaking();
      if (state.voiceMode && voiceState === VoiceState.SPEAKING) {
        startListeningForVoice();
      }
    });

    voiceStopBtn.addEventListener('click', exitVoiceMode);
    voiceCancelBtn.addEventListener('click', () => {
      exitVoiceMode();
    });

    settingsToggle.addEventListener('click', () => {
      settingsPanel.classList.toggle('open');
    });

    settingsClose.addEventListener('click', () => {
      settingsPanel.classList.remove('open');
    });

    ttsEnabled.addEventListener('change', () => {
      saveSettings({ ttsEnabled: ttsEnabled.checked });
    });

    voiceSelect.addEventListener('change', () => {
      saveSettings({ voiceUri: voiceSelect.value });
    });

    traceVisible.addEventListener('change', () => {
      saveSettings({ traceVisible: traceVisible.checked });
    });

    $('#trace-close').addEventListener('click', () => {
      saveSettings({ traceVisible: false });
    });

    // Auto-resize textarea
    msgInput.addEventListener('input', () => {
      msgInput.style.height = 'auto';
      msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
    });
  }

  init();
})();
</script>

</body>
</html>
