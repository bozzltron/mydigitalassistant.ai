<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cognitive Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242836;
      --border: #2e3347;
      --user-msg: #1e3a5f;
      --assistant-msg: #1a2420;
      --text: #e8e9ed;
      --text-dim: #8b8fa3;
      --accent: #5b9cf6;
      --accent2: #4ec9a0;
      --error: #f47070;
      --warning: #f0b97c;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .user-badge {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .voice-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .voice-btn:hover { background: var(--border); }
    .voice-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .settings-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.25rem;
    }

    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .msg {
      max-width: 80%;
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 0.9rem;
    }

    .msg-user {
      align-self: flex-end;
      background: var(--user-msg);
      border-bottom-right-radius: 2px;
    }

    .msg-assistant {
      align-self: flex-start;
      background: var(--assistant-msg);
      border-bottom-left-radius: 2px;
    }

    .msg-assistant .content img { max-width: 100%; border-radius: 4px; }
    .msg-assistant .content code {
      background: rgba(255,255,255,0.1);
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: 0.85em;
    }
    .msg-assistant .content pre {
      background: rgba(0,0,0,0.3);
      padding: 0.6rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0.4rem 0;
    }
    .msg-assistant .content pre code {
      background: none;
      padding: 0;
    }
    .msg-assistant .content a { color: var(--accent); }
    .msg-assistant .content ul, .msg-assistant .content ol {
      margin-left: 1.2rem;
    }
    .msg-assistant .content h1, .msg-assistant .content h2,
    .msg-assistant .content h3 { margin: 0.5rem 0 0.25rem; }

    .msg-sources {
      margin-top: 0.4rem;
      font-size: 0.78rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      padding-top: 0.35rem;
    }

    .msg-meta {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 0.2rem;
    }

    .sources-header {
      font-weight: 600;
      color: var(--accent2);
      display: block;
      margin-bottom: 0.2rem;
    }

    .sources-list {
      list-style: none;
      margin-top: 0.2rem;
    }

    .sources-list li {
      margin: 0.15rem 0;
    }

    .sources-list a { color: var(--accent); }

    #input-row {
      padding: 0.75rem 1rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    #input-row textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.6rem 0.8rem;
      font-family: var(--font);
      font-size: 0.9rem;
      resize: none;
      min-height: 42px;
      max-height: 120px;
      line-height: 1.4;
    }

    #input-row textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    #send-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      border-radius: 8px;
      padding: 0 1.1rem;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    #send-btn:hover { opacity: 0.85; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Trace panel */
    #trace-panel {
      width: 340px;
      border-left: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    #trace-panel.hidden { display: none; }

    .trace-header {
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .trace-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1rem;
    }

    .trace-content {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      font-size: 0.78rem;
    }

    .trace-section {
      margin-bottom: 1rem;
    }

    .trace-label {
      color: var(--accent2);
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .trace-value {
      color: var(--text-dim);
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--bg);
      padding: 0.5rem;
      border-radius: 5px;
      border: 1px solid var(--border);
      max-height: 200px;
      overflow-y: auto;
    }

    /* Settings panel (slide-in) */
    #settings-panel {
      position: fixed;
      top: 0;
      right: -300px;
      width: 300px;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 100;
      transition: right 0.25s ease;
      padding: 1rem;
      overflow-y: auto;
    }

    #settings-panel.open { right: 0; }

    .settings-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-section {
      margin-bottom: 1.25rem;
    }

    .settings-section label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 0.35rem;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .toggle-label { font-size: 0.85rem; }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem;
      border-radius: 5px;
      font-size: 0.85rem;
    }

    /* Voice recording overlay */
    #voice-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    #voice-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .voice-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      min-width: 240px;
    }

    .voice-bubble h3 {
      font-size: 0.9rem;
      color: var(--text-dim);
      margin-bottom: 1rem;
    }

    .pulse-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      margin: 0 auto 1rem;
      animation: pulse 1.2s infinite;
      position: relative;
    }

    .pulse-ring::after {
      content: '';
      position: absolute;
      inset: 8px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0.5;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.7; }
    }

    .voice-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .voice-stop {
      background: var(--error);
      border: none;
      color: #fff;
      border-radius: 6px;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .voice-cancel {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.5rem 1.2rem;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Welcome / loading states */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--text-dim);
    }

    .welcome-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .welcome h2 {
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--text);
    }

    .welcome p { font-size: 0.85rem; }

    .loading-dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    /* Mic button in input row */
    #mic-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0 0.75rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    #mic-btn:hover { background: var(--border); }
    #mic-btn.recording { background: var(--error); border-color: var(--error); color: #fff; }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <h1>Cognitive Assistant</h1>
  <div class="header-right">
    <span class="user-badge" id="user-badge">Loading...</span>
    <button id="voice-mode-btn" class="voice-btn" title="Voice conversation mode">
      &#127908; Voice
    </button>
    <button class="settings-btn" id="settings-toggle" title="Settings">&#9881;</button>
  </div>
</header>

<div id="main">
  <div id="chat-area">
    <div id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">&#129504;</div>
        <h2>Ready to chat</h2>
        <p>Type a message below or click Voice to start hands-free.</p>
      </div>
    </div>

    <div id="input-row">
      <textarea id="msg-input" rows="1" placeholder="Type a message..."></textarea>
      <button id="mic-btn" title="Voice input">&#127908;</button>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <div id="trace-panel">
    <div class="trace-header">
      <span>&#128200; Trace</span>
      <button class="trace-close" id="trace-close">&times;</button>
    </div>
    <div class="trace-content" id="trace-content">
      <div class="trace-section">
        <div class="trace-label">Task type</div>
        <div class="trace-value" id="trace-task-type">-</div>
      </div>
      <div class="trace-section">
        <div class="trace-label">Memory context</div>
        <div class="trace-value" id="trace-memory">-</div>
      </div>
      <div class="trace-section">
        <div class="trace-label">Citations</div>
        <div class="trace-value" id="trace-citations">-</div>
      </div>
    </div>
  </div>
</div>

<!-- Settings panel -->
<div id="settings-panel">
  <div class="settings-title">
    Settings
    <button class="settings-close" id="settings-close">&times;</button>
  </div>

  <div class="settings-section">
    <label>Voice settings</label>
    <div class="toggle-row">
      <span class="toggle-label">Read responses aloud</span>
      <input type="checkbox" id="tts-enabled" />
    </div>
    <div class="settings-section">
      <label for="voice-select">Voice</label>
      <select id="voice-select">
        <option value="">Loading voices...</option>
      </select>
    </div>
  </div>

  <div class="settings-section">
    <label>Interface</label>
    <div class="toggle-row">
      <span class="toggle-label">Show trace panel</span>
      <input type="checkbox" id="trace-visible" checked />
    </div>
  </div>
</div>

<!-- Voice recording overlay -->
<div id="voice-overlay">
  <div class="voice-bubble">
    <h3 id="voice-status">Listening<span class="loading-dots"></span></h3>
    <div class="pulse-ring"></div>
    <div class="voice-actions">
      <button class="voice-stop" id="voice-stop">Stop</button>
      <button class="voice-cancel" id="voice-cancel">Cancel</button>
    </div>
  </div>
</div>

<script src="/static/marked.min.js"></script>
<script>
(function() {
  'use strict';

  // ---- State ----
  const state = {
    userId: null,
    sessionId: localStorage.getItem('session_id') || null,
    userName: '',
    messages: [],
    voiceMode: false,
    mediaRecorder: null,
    audioChunks: [],
    isRecording: false,
  };

  // ---- DOM refs ----
  const $ = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);

  const messagesEl = $('#messages');
  const msgInput = $('#msg-input');
  const sendBtn = $('#send-btn');
  const micBtn = $('#mic-btn');
  const userBadge = $('#user-badge');
  const tracePanel = $('#trace-panel');
  const traceTaskType = $('#trace-task-type');
  const traceMemory = $('#trace-memory');
  const traceCitations = $('#trace-citations');
  const voiceOverlay = $('#voice-overlay');
  const voiceStatus = $('#voice-status');
  const voiceStopBtn = $('#voice-stop');
  const voiceCancelBtn = $('#voice-cancel');
  const voiceModeBtn = $('#voice-mode-btn');
  const settingsPanel = $('#settings-panel');
  const settingsToggle = $('#settings-toggle');
  const settingsClose = $('#settings-close');
  const ttsEnabled = $('#tts-enabled');
  const voiceSelect = $('#voice-select');
  const traceVisible = $('#trace-visible');

  // ---- Backend URL ----
  const BASE = window.location.origin;

  // ---- Helpers ----
  async function api(path, opts = {}) {
    const res = await fetch(BASE + path, opts);
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || 'Request failed');
    }
    return res.json();
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(role, content, meta = {}) {
    const welcome = $('#welcome');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = `msg msg-${role}`;

    const contentDiv = document.createElement('div');
    contentDiv.className = 'content';
    contentDiv.innerHTML = marked.parse(content || '');
    div.appendChild(contentDiv);

    if (meta.task_type) {
      const metaEl = document.createElement('div');
      metaEl.className = 'msg-meta';
      metaEl.textContent = `type: ${meta.task_type}`;
      div.appendChild(metaEl);
    }

    if (meta.citations && meta.citations.length > 0) {
      const srcDiv = document.createElement('div');
      srcDiv.className = 'msg-sources';
      srcDiv.innerHTML = `<span class="sources-header">Sources:</span><ul class="sources-list">${
        meta.citations.map(u => `<li><a href="${u}" target="_blank" rel="noopener">${u}</a></li>`).join('')
      }</ul>`;
      div.appendChild(srcDiv);
    }

    messagesEl.appendChild(div);
    scrollBottom();

    // TTS
    if (role === 'assistant' && getSettings().ttsEnabled && content) {
      speak(content);
    }

    // Save to history
    state.messages.push({ role, content, ...meta });

    // Update trace panel
    if (meta.task_type) traceTaskType.textContent = meta.task_type;
    if (meta.memory_context) traceMemory.textContent = meta.memory_context.slice(0, 500) + (meta.memory_context.length > 500 ? '...' : '');
    if (meta.citations) {
      traceCitations.textContent = meta.citations.length > 0
        ? meta.citations.join('\n')
        : 'none';
    }

    return div;
  }

  function setLoading(loading) {
    sendBtn.disabled = loading;
    msgInput.disabled = loading;
    if (loading) {
      const div = document.createElement('div');
      div.className = 'msg msg-assistant';
      div.id = 'loading-msg';
      div.innerHTML = '<div class="content"><em>Thinking<span class="loading-dots"></span></em></div>';
      messagesEl.appendChild(div);
      scrollBottom();
    } else {
      const el = $('#loading-msg');
      if (el) el.remove();
    }
  }

  // ---- Settings (localStorage) ----
  function getSettings() {
    return {
      ttsEnabled: localStorage.getItem('tts_enabled') === 'true',
      voiceUri: localStorage.getItem('voice_uri') || '',
      traceVisible: localStorage.getItem('trace_visible') !== 'false',
      voiceMode: localStorage.getItem('voice_mode') === 'true',
    };
  }

  function saveSettings(s) {
    if ('ttsEnabled' in s) localStorage.setItem('tts_enabled', String(s.ttsEnabled));
    if ('voiceUri' in s) localStorage.setItem('voice_uri', s.voiceUri);
    if ('traceVisible' in s) localStorage.setItem('trace_visible', String(s.traceVisible));
    if ('voiceMode' in s) localStorage.setItem('voice_mode', String(s.voiceMode));
    applySettings();
  }

  function applySettings() {
    const s = getSettings();
    ttsEnabled.checked = s.ttsEnabled;
    traceVisible.checked = s.traceVisible;
    tracePanel.classList.toggle('hidden', !s.traceVisible);
    voiceModeBtn.classList.toggle('active', s.voiceMode);
  }

  // ---- TTS ----
  let currentUtterance = null;

  function populateVoices() {
    const voices = speechSynthesis.getVoices();
    const localVoices = voices.filter(v => !v.url); // local voices only
    voiceSelect.innerHTML = '';
    if (localVoices.length === 0) {
      voiceSelect.innerHTML = '<option value="">No local voices found</option>';
      return;
    }
    const settings = getSettings();
    localVoices.forEach((v, i) => {
      const opt = document.createElement('option');
      opt.value = v.voiceURI;
      opt.textContent = `${v.name} (${v.lang})`;
      if (v.voiceURI === settings.voiceUri) opt.selected = true;
      voiceSelect.appendChild(opt);
    });
    if (!settings.voiceUri && localVoices.length > 0) {
      voiceSelect.selectedIndex = 0;
      saveSettings({ voiceUri: localVoices[0].voiceURI });
    }
  }

  function speak(text) {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const s = getSettings();
    const voices = speechSynthesis.getVoices();
    const voice = voices.find(v => v.voiceURI === s.voiceUri) || voices[0];
    if (!voice) return;

    const plain = text.replace(/[#*`_\[\]]/g, '').replace(/\n+/g, ' ').trim();
    const u = new SpeechSynthesisUtterance(plain);
    u.voice = voice;
    u.rate = 1.1;
    u.pitch = 1.0;
    currentUtterance = u;
    speechSynthesis.speak(u);
  }

  // ---- Chat ----
  async function sendMessage(text) {
    if (!text.trim() || !state.userId) return;
    if (state.sessionId) {
      localStorage.setItem('session_id', state.sessionId);
    }

    addMessage('user', text);
    msgInput.value = '';
    setLoading(true);

    try {
      const resp = await api('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: state.userId,
          message: text,
          session_id: state.sessionId,
        }),
      });

      state.sessionId = resp.session_id;
      localStorage.setItem('session_id', resp.session_id);

      addMessage('assistant', resp.response, {
        task_type: resp.task_type,
        memory_context: resp.memory_context,
        citations: resp.citations || [],
      });

      // Voice mode: keep listening after response
      if (state.voiceMode && !state.isRecording) {
        setTimeout(startRecording, 800);
      }
    } catch (err) {
      addMessage('assistant', `Error: ${err.message}`);
    } finally {
      setLoading(false);
    }
  }

  // ---- Voice input (MediaRecorder + /transcribe) ----
  let mediaStream = null;

  async function startRecording() {
    if (state.isRecording) return;
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      state.mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm' });
      state.audioChunks = [];

      state.mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          state.audioChunks.push(e.data);
        }
      };

      state.mediaRecorder.onstop = async () => {
        if (state.audioChunks.length === 0) return;
        const blob = new Blob(state.audioChunks, { type: 'audio/webm' });
        state.audioChunks = [];
        await sendAudioForTranscription(blob);
      };

      state.mediaRecorder.start();
      state.isRecording = true;
      micBtn.classList.add('recording');

      // Auto-stop after 30 seconds max
      state._recordingTimeout = setTimeout(() => {
        if (state.isRecording) stopRecording();
      }, 30000);
    } catch (e) {
      console.warn('Failed to start recording:', e);
      alert('Microphone access denied or not available.');
    }
  }

  function stopRecording() {
    if (!state.isRecording || !state.mediaRecorder) return;
    clearTimeout(state._recordingTimeout);
    state.mediaRecorder.stop();
    if (mediaStream) {
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
    }
    state.isRecording = false;
    micBtn.classList.remove('recording');
  }

  async function sendAudioForTranscription(blob) {
    voiceStatus.textContent = 'Transcribing...';
    try {
      const formData = new FormData();
      formData.append('file', blob, 'audio.webm');

      const res = await fetch(BASE + '/transcribe', {
        method: 'POST',
        body: formData,
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: 'Transcription failed' }));
        throw new Error(err.detail || 'Transcription failed');
      }

      const data = await res.json();
      const text = (data.text || '').trim();

      if (text) {
        sendMessage(text);
      } else {
        if (state.voiceMode) setTimeout(startRecording, 500);
      }
    } catch (err) {
      console.error('Transcription error:', err);
      addMessage('assistant', `Transcription error: ${err.message}`);
      if (state.voiceMode) setTimeout(startRecording, 1000);
    }
  }

  // ---- Voice conversation mode ----
  function enterVoiceMode() {
    state.voiceMode = true;
    saveSettings({ voiceMode: true });
    voiceOverlay.classList.add('active');
    voiceStatus.textContent = 'Recording';
    startRecording();
  }

  function exitVoiceMode() {
    state.voiceMode = false;
    saveSettings({ voiceMode: false });
    stopRecording();
    voiceOverlay.classList.remove('active');
  }

  // ---- Init ----
  async function init() {
    // Load users
    try {
      const users = await api('/users');
      if (users.length === 0) {
        userBadge.textContent = 'No user — create one via CLI';
      } else {
        const savedUserId = localStorage.getItem('user_id');
        const user = savedUserId
          ? users.find(u => u.id === parseInt(savedUserId)) || users[0]
          : users[0];
        state.userId = user.id;
        state.userName = user.name;
        localStorage.setItem('user_id', user.id);
        userBadge.textContent = user.name;
      }
    } catch (e) {
      userBadge.textContent = 'Error loading user';
    }

    // TTS voices
    if (window.speechSynthesis) {
      speechSynthesis.onvoiceschanged = populateVoices;
      populateVoices();
    }

    // Apply settings
    applySettings();

    // Restore session messages from memory
    // (we don't store full history in localStorage, just reload via conversation)

    // Events
    sendBtn.addEventListener('click', () => sendMessage(msgInput.value));
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(msgInput.value);
      }
    });

    micBtn.addEventListener('click', () => {
      if (state.isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    voiceModeBtn.addEventListener('click', () => {
      if (state.voiceMode) {
        exitVoiceMode();
      } else {
        enterVoiceMode();
      }
    });

    voiceStopBtn.addEventListener('click', exitVoiceMode);
    voiceCancelBtn.addEventListener('click', () => {
      exitVoiceMode();
    });

    settingsToggle.addEventListener('click', () => {
      settingsPanel.classList.toggle('open');
    });

    settingsClose.addEventListener('click', () => {
      settingsPanel.classList.remove('open');
    });

    ttsEnabled.addEventListener('change', () => {
      saveSettings({ ttsEnabled: ttsEnabled.checked });
    });

    voiceSelect.addEventListener('change', () => {
      saveSettings({ voiceUri: voiceSelect.value });
    });

    traceVisible.addEventListener('change', () => {
      saveSettings({ traceVisible: traceVisible.checked });
    });

    $('#trace-close').addEventListener('click', () => {
      saveSettings({ traceVisible: false });
    });

    // Auto-resize textarea
    msgInput.addEventListener('input', () => {
      msgInput.style.height = 'auto';
      msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
    });
  }

  init();
})();
</script>

</body>
</html>
