services:
  test:
    build:
      context: .
      target: builder
    container_name: assistant-tests
    working_dir: /app
    volumes:
      - .:/app
      - assistant-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/assistant-test.db
    command: pip install -e ".[dev]" && pytest tests/ -v
    user: root

  dev:
    build: .
    container_name: assistant-dev
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_PATH=/app/data/assistant.db
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      - .:/app
      - assistant-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn assistant.backend.main:app --host 127.0.0.1 --port 8000 --reload
