name: mydigitalassistantai-dev

# See docker-compose.prod.yml: json-file defaults to unbounded and this app is
# chatty. Same cap; prod additionally runs autoheal, which dev deliberately does
# not — dev is where a wedged container should be visible, not restarted away.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  assistant:
    build: .
    container_name: assistant-backend-dev
    # Forward the WHOLE .env, so every documented setting reaches the container.
    # The `environment:` block below stays as the compose-internal override +
    # default layer — it wins over env_file for the vars it names. Without this,
    # a var documented in .env.example but absent from that block silently falls
    # back to its config.py default (38 of 68 did).
    # `required: false` so a fresh clone with no .env still starts on the defaults
    # (create one with `cp .env.example .env`).
    env_file:
      - path: .env
        required: false
    # Ollama runs on the HOST (see OLLAMA_URL). For model residency (Option A)
    # the host daemon needs: OLLAMA_KEEP_ALIVE=-1 and
    # OLLAMA_MAX_LOADED_MODELS>=2 (chat + utility stay warm side-by-side).
    environment:
      # The brain lives in its own volume mounted at /app/brain (see volumes).
      - DATABASE_PATH=/app/brain/assistant.dev.db
      - DB_KEY=${DB_KEY}
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-600}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
      - CHAT_MODEL=${CHAT_MODEL:-qwen3.5:9b}
      - UTILITY_MODEL=${UTILITY_MODEL:-qwen3.5:4b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      - CODER_MODEL=${CODER_MODEL:-}
      # Math/computation model. OFF by default — a 30B-class model here (e.g.
      # qwen3-coder:30b) competes with chat/utility for host RAM and thrashes
      # the Ollama scheduler. Opt in with MATH_MODEL and keep MATH_NUM_CTX small.
      - MATH_MODEL=${MATH_MODEL:-qwen3.5:4b}
      - MATH_NUM_CTX=${MATH_NUM_CTX:-4096}
      - MATH_KEEP_ALIVE=${MATH_KEEP_ALIVE:-10m}
      # Tools model: same brain as chat so tool calls + final answer share the
      # hot KV cache (Phase 6 M5 + fleet redesign).
      - TOOLS_MODEL=${TOOLS_MODEL:-qwen3.5:9b}
      # Only used when TOOLS_MODEL differs from CHAT_MODEL; they share one
      # context window otherwise. Kept >= CHAT_NUM_CTX so the tool loop (system
      # prompt + tool schemas + history) always has generation headroom.
      - TOOLS_NUM_CTX=${TOOLS_NUM_CTX:-32768}
      - TOOLS_KEEP_ALIVE=${TOOLS_KEEP_ALIVE:--1}
      # Context window for the chat/tools model. The tool loop carries the
      # system prompt + every tool schema + history, so this must leave room to
      # generate. Passed through so the .env knob is not inert in Docker.
      - CHAT_NUM_CTX=${CHAT_NUM_CTX:-32768}
      # Max-intelligence escalation tier (Phase 6 M6). On-demand with a short
      # keep_alive — never resident next to the warm set. Empty = fall back to
      # thinking-mode on the chat model.
      - MAX_MODEL=${MAX_MODEL:-}
      - MAX_NUM_CTX=${MAX_NUM_CTX:-32768}
      - MAX_KEEP_ALIVE=${MAX_KEEP_ALIVE:-10m}
      # Binds inside the container only. Exposure is controlled by port
      # publishing: the assistant service publishes NO ports; Caddy is the
      # single published surface (127.0.0.1:8443). Loopback-in-container would
      # break Caddy's appnet proxy.
      - BACKEND_HOST=0.0.0.0
      - SEARCH_BASE_URL=http://searxng:8080
      - BRAVE_ENABLED=${BRAVE_ENABLED:-false}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      # Brave's agent-oriented LLM Context endpoint (see docs/SEARCH.md). On by
      # default; set BRAVE_LLM_CONTEXT=false to fall back to /web/search.
      - BRAVE_LLM_CONTEXT=${BRAVE_LLM_CONTEXT:-true}
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - DAILY_TASKS_TIME=${DAILY_TASKS_TIME:-09:00}
      - DAILY_TASKS_TZ=${DAILY_TASKS_TZ:-}
      - TZ=${TZ:-}
      # Tool calling (Phase 6 M5): enables list_files, read_file, web_search, etc.
      - TOOLS_ENABLED=${TOOLS_ENABLED:-true}
      # Maps (docs/MAPS.md). Dev defaults on so the map page is reachable;
      # MAPS_ENABLED_DEV overrides just this environment, MAPS_ENABLED both.
      - MAPS_ENABLED=${MAPS_ENABLED_DEV:-${MAPS_ENABLED:-true}}
    volumes:
      # The brain (SQLite DB + its backups) lives in a named volume mounted at
      # /app/brain. The DB file itself never moves — only the path the app opens
      # it through (DATABASE_PATH). It is deliberately NOT under the sandbox
      # below, so the sandbox can be the host folder without exposing the brain.
      - assistant-data:/app/brain
      # The file sandbox IS this host folder: every file the agent reads or writes
      # is visible here, and files you drop in are read by the tools at paths
      # relative to the sandbox root (e.g. read_file("notes.md")). On an existing
      # install, copy the files out of the volume once — see docs/FILES.md.
      # Dev defaults to ~/Documents/Agent/Development. Override just this
      # environment with SANDBOX_DIR_DEV, or both at once with SANDBOX_DIR (prod
      # defaults to ~/Documents/Agent/Production, so the two never share files).
      - ${SANDBOX_DIR_DEV:-${SANDBOX_DIR:-$HOME/Documents/Agent/Development}}:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # $${...} = expanded at RUNTIME inside the container (container env wins);
    # a host-side .env value can no longer silently override the bind.
    command: ["sh", "-c", "uvicorn assistant.backend.main:app --host $${BACKEND_HOST:-0.0.0.0} --port 8000"]
    # Healthcheck comes from the image (Dockerfile) and probes /healthz.
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - appnet

  caddy:
    image: caddy:alpine
    container_name: caddy
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./.data/caddy:/etc/caddy/certs
      - caddy-data:/data
    depends_on:
      - assistant
    restart: unless-stopped
    logging: *default-logging
    networks:
      - appnet

  cli:
    build: .
    container_name: assistant-cli-dev
    environment:
      - ASSISTANT_BACKEND=http://assistant-backend:8000
      - DATABASE_PATH=/app/brain/assistant.dev.db
    depends_on:
      - assistant
    volumes:
      - assistant-data:/app/brain:ro
    entrypoint: ["python", "-m", "assistant.cli.app"]
    command: ["status"]
    restart: "no"
    profiles:
      - cli
    networks:
      - appnet

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
      # REQUIRED. Compose does not run a shell, so the old
      # `:-$(head -c 32 /dev/urandom | base64)` passed that literal string as
      # the secret -- it was never generated, and never random. Fail fast
      # instead: generate once with `openssl rand -base64 32` into .env.
      - "SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET is required; generate with: openssl rand -base64 32}"
      # The image runs as root and by default chowns the bind-mounted config
      # directory on the host to searxng:searxng. The shipped settings.yml and
      # limiter.toml need no writes, so leave the host directory untouched.
      - FORCE_OWNERSHIP=false
    volumes:
      # settings.yml + limiter.toml are provided, so SearXNG only reads here.
      - ./searxng:/etc/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - appnet

  # SolidJS dev server for hot-reloading
  solid-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: solid-dev-server
    ports:
      - "5174:5173"
    volumes:
      # Mount the whole frontend directory rather than individual files. A file
      # bind mount pins an inode, so any `git checkout`/`stash`/branch switch that
      # replaces a file (git writes a new inode) leaves the container reading a
      # deleted one -- Vite then fails with ENOENT on /app/frontend/index.html.
      # The named volume keeps the container's linux node_modules from being
      # shadowed by the host's.
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
      - ./assistant/backend/static:/app/assistant/backend/static
    environment:
      - NODE_ENV=development
      - PORT=5173
      - REACT_APP_API_URL=http://assistant-backend:8000
    depends_on:
      - assistant
    restart: unless-stopped
    logging: *default-logging
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  assistant-data:
    driver: local
  caddy-data:
    driver: local
  frontend-node-modules:
    driver: local
