services:
  assistant:
    build: .
    container_name: assistant-backend
    # Ollama runs on the HOST (see OLLAMA_URL). For model residency (Option A)
    # the host daemon needs: OLLAMA_KEEP_ALIVE=-1 and
    # OLLAMA_MAX_LOADED_MODELS>=2 (chat + utility stay warm side-by-side).
    environment:
      - DATABASE_PATH=/app/data/assistant.db
      - DB_KEY=${DB_KEY}
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-600}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
      - CHAT_MODEL=${CHAT_MODEL:-qwen3.5:9b}
      - UTILITY_MODEL=${UTILITY_MODEL:-qwen3.5:4b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      - CODER_MODEL=${CODER_MODEL:-}
      # Math/computation model. OFF by default — a 30B-class model here (e.g.
      # qwen3-coder:30b) competes with chat/utility for host RAM and thrashes
      # the Ollama scheduler. Opt in with MATH_MODEL and keep MATH_NUM_CTX small.
      - MATH_MODEL=${MATH_MODEL:-}
      - MATH_NUM_CTX=${MATH_NUM_CTX:-16384}
      - MATH_KEEP_ALIVE=${MATH_KEEP_ALIVE:-10m}
      # Tools model: same brain as chat so tool calls + final answer share the
      # hot KV cache (Phase 6 M5 + fleet redesign).
      - TOOLS_MODEL=${TOOLS_MODEL:-qwen3.5:9b}
      # Only used when TOOLS_MODEL differs from CHAT_MODEL; they share one
      # context window otherwise. Kept >= CHAT_NUM_CTX so the tool loop (system
      # prompt + tool schemas + history) always has generation headroom.
      - TOOLS_NUM_CTX=${TOOLS_NUM_CTX:-16384}
      - TOOLS_KEEP_ALIVE=${TOOLS_KEEP_ALIVE:--1}
      # Context window for the chat/tools model. The tool loop carries the
      # system prompt + every tool schema + history, so this must leave room to
      # generate. Passed through so the .env knob is not inert in Docker.
      - CHAT_NUM_CTX=${CHAT_NUM_CTX:-16384}
      # Max-intelligence escalation tier (Phase 6 M6). On-demand with a short
      # keep_alive — never resident next to the warm set. Empty = fall back to
      # thinking-mode on the chat model.
      - MAX_MODEL=${MAX_MODEL:-}
      - MAX_NUM_CTX=${MAX_NUM_CTX:-16384}
      - MAX_KEEP_ALIVE=${MAX_KEEP_ALIVE:-10m}
      # Binds inside the container only. Exposure is controlled by port
      # publishing: the assistant service publishes NO ports; Caddy is the
      # single published surface (127.0.0.1:8443). Loopback-in-container would
      # break Caddy's appnet proxy.
      - BACKEND_HOST=0.0.0.0
      - SEARCH_BASE_URL=http://searxng:8080
      - BRAVE_ENABLED=${BRAVE_ENABLED:-false}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - DAILY_TASKS_TIME=${DAILY_TASKS_TIME:-09:00}
      - DAILY_TASKS_TZ=${DAILY_TASKS_TZ:-}
      - TZ=${TZ:-}
      # Tool calling (Phase 6 M5): enables list_files, read_file, web_search, etc.
      - TOOLS_ENABLED=${TOOLS_ENABLED:-false}
    volumes:
      - assistant-data:/app/data
      - ./assistant/backend/static:/app/assistant/backend/static:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # $${...} = expanded at RUNTIME inside the container (container env wins);
    # a host-side .env value can no longer silently override the bind.
    command: ["sh", "-c", "uvicorn assistant.backend.main:app --host $${BACKEND_HOST:-0.0.0.0} --port 8000"]
    restart: unless-stopped
    networks:
      - appnet

  caddy:
    image: caddy:alpine
    container_name: caddy
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./.data/caddy:/etc/caddy/certs
      - caddy-data:/data
    depends_on:
      - assistant
    restart: unless-stopped
    networks:
      - appnet

  cli:
    build: .
    container_name: assistant-cli
    environment:
      - ASSISTANT_BACKEND=http://assistant-backend:8000
    depends_on:
      - assistant
    volumes:
      - assistant-data:/app/data:ro
    entrypoint: ["python", "-m", "assistant.cli.app"]
    command: ["status"]
    restart: "no"
    profiles:
      - cli
    networks:
      - appnet

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
      # REQUIRED. Compose does not run a shell, so the old
      # `:-$(head -c 32 /dev/urandom | base64)` passed that literal string as
      # the secret -- it was never generated, and never random. Fail fast
      # instead: generate once with `openssl rand -base64 32` into .env.
      - "SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET is required; generate with: openssl rand -base64 32}"
      # The image runs as root and by default chowns the bind-mounted config
      # directory on the host to searxng:searxng. The shipped settings.yml and
      # limiter.toml need no writes, so leave the host directory untouched.
      - FORCE_OWNERSHIP=false
    volumes:
      # settings.yml + limiter.toml are provided, so SearXNG only reads here.
      - ./searxng:/etc/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - appnet

  # SolidJS dev server for hot-reloading
  solid-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: solid-dev-server
    ports:
      - "5174:5173"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/frontend/tsconfig.node.json
      - ./frontend/eslint.config.js:/app/frontend/eslint.config.js
      - ./assistant/backend/static:/app/assistant/backend/static
    environment:
      - NODE_ENV=development
      - PORT=5173
      - REACT_APP_API_URL=http://assistant-backend:8000
    depends_on:
      - assistant
    restart: unless-stopped
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  assistant-data:
    driver: local
  caddy-data:
    driver: local
