services:
  assistant:
    build: .
    container_name: assistant-backend
    environment:
      - DATABASE_PATH=/app/data/assistant.db
      - DB_KEY=${DB_KEY}
      - OLLAMA_URL=http://host.docker.internal:11434
      - CHAT_MODEL=${CHAT_MODEL:-qwen2.5:7b}
      - UTILITY_MODEL=${UTILITY_MODEL:-qwen2.5:3b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - CODER_MODEL=${CODER_MODEL:-}
      - BACKEND_HOST=127.0.0.1
      - SEARCH_BASE_URL=http://searxng:8080
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
    volumes:
      - assistant-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "uvicorn assistant.backend.main:app --host ${BACKEND_HOST} --port 8000"]
    restart: unless-stopped
    networks:
      - appnet

  caddy:
    image: caddy:alpine
    container_name: caddy
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./.data/caddy:/etc/caddy/certs
      - caddy-data:/data
    depends_on:
      - assistant
    restart: unless-stopped
    networks:
      - appnet

  cli:
    build: .
    container_name: assistant-cli
    environment:
      - ASSISTANT_BACKEND=http://assistant-backend:8000
    depends_on:
      - assistant
    volumes:
      - assistant-data:/app/data:ro
    entrypoint: ["python", "-m", "assistant.cli.app"]
    command: ["status"]
    restart: "no"
    profiles:
      - cli
    networks:
      - appnet

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
      - SEARXNG_SECRET=${SEARXNG_SECRET:-$(head -c 32 /dev/urandom | base64)}
    volumes:
      - ./searxng:/etc/searxng
    restart: unless-stopped
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  assistant-data:
    driver: local
  caddy-data:
    driver: local
