# Open WebUI with Whisper (STT) and Edge TTS (TTS) integration
# This gives you a production-ready local AI assistant with voice input AND output

services:
  # Local TTS service (no API key required)
  edge-tts:
    image: travisvn/openai-edge-tts:latest
    container_name: edge-tts
    ports:
      - "5050:5050"
    restart: unless-stopped

  # Privacy-respecting web search engine (self-hosted)
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8889:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./searxng-config/settings.yml:/etc/searxng/settings.yml:ro  # Custom settings with JSON format enabled
    environment:
      - SEARXNG_HOSTNAME=localhost
      # Generate a random secret key for production:
      # - SEARXNG_SECRET=$(openssl rand -hex 32)
      # For local use, the default in settings.yml is fine
    restart: unless-stopped

  # Email bot - receives emails and responds using AI (optional)
  email-bot:
    build:
      context: ./email-bot
      dockerfile: Dockerfile
    container_name: email-bot
    env_file:
      - ./email-bot/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Uncomment to enable email bot:
    # profiles:
    #   - email

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "8888:8080"
    depends_on:
      - searxng
      - edge-tts
    environment:
      # Connect to Ollama on host (uses Metal GPU automatically on Mac M4)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      
      # Whisper configuration for speech-to-text
      # Leave AUDIO_STT_ENGINE unset or empty to use local faster-whisper
      - AUDIO_STT_ENGINE=
      - WHISPER_MODEL=base   # Model size: tiny, base, small, medium, large
      - WHISPER_MODEL_DIR=/root/.cache/whisper
      - WHISPER_LANGUAGE=en  # Optional: auto-detect if not set
      
      # WebSocket configuration (fixes connection errors)
      - WEBUI_URL=http://localhost:8888
      - CORS_ALLOW_ORIGIN=http://localhost:8888
      
      # Text-to-Speech configuration (local, no API key needed)
      # Configure in Open WebUI: Settings > Audio > Text-to-Speech Engine = OpenAI
      # API Base URL: http://edge-tts:5050/v1 (use service name, not localhost)
      # API Key: your_api_key_here (any placeholder, not used)
      # TTS Model: tts-1
      # TTS Voice: en-GB-LibbyNeural (UK female) or alloy, echo, fable, onyx, nova, shimmer
      
      # Web Search configuration (self-hosted, privacy-respecting)
      # Configure in Open WebUI: Settings > Web Search
      # Web Search Engine: searxng
      # Searxng Query URL: http://searxng:8080/search
      # ⚠️ IMPORTANT: Use 'searxng:8080' (Docker service name) in Open WebUI settings, NOT localhost
      # (localhost:8889 is only for testing SearXNG directly from your browser)
      
      # Admin setup - IMPORTANT: Change after first login!
      # Set to true for first-time setup, then change to false for security
      - ENABLE_SIGNUP=true
      - DEFAULT_USER_ROLE=admin  # First user becomes admin
      
      # After creating admin account, change to:
      # - ENABLE_SIGNUP=false
      
      # Optional: Customization
      # - WEBUI_NAME="My Digital Assistant"
    volumes:
      - open-webui-data:/app/backend/data
      - whisper-models:/root/.cache/whisper
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Note: faster-whisper needs to be installed after container starts:
    # docker exec open-webui pip install --no-cache-dir faster-whisper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  open-webui-data:
    driver: local
  whisper-models:
    driver: local
  searxng-data:
    driver: local

