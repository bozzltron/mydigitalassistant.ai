name: mydigitalassistantai

# Log rotation, shared by the long-running services. Docker's json-file driver
# defaults to unbounded (verified: `Config: map[]`), and this app logs per turn,
# per LLM call, and per embedding, so an unbounded log grows without limit —
# slow in normal use, acute in a crash loop. 30MB per service is ample.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  assistant:
    build: .
    container_name: assistant-backend
    # Ollama runs on the HOST (see OLLAMA_URL). For model residency (Option A)
    # the host daemon needs: OLLAMA_KEEP_ALIVE=-1 and
    # OLLAMA_MAX_LOADED_MODELS>=2 (chat + utility stay warm side-by-side).
    environment:
      - DATABASE_PATH=/app/data/assistant.db
      - DB_KEY=${DB_KEY}
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-600}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
      - CHAT_MODEL=${CHAT_MODEL:-qwen3.5:9b}
      - UTILITY_MODEL=${UTILITY_MODEL:-qwen3.5:4b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      - CODER_MODEL=${CODER_MODEL:-}
      - MATH_MODEL=${MATH_MODEL:-}
      - MATH_NUM_CTX=${MATH_NUM_CTX:-16384}
      - MATH_KEEP_ALIVE=${MATH_KEEP_ALIVE:-10m}
      - TOOLS_MODEL=${TOOLS_MODEL:-qwen3.5:9b}
      - TOOLS_NUM_CTX=${TOOLS_NUM_CTX:-16384}
      - TOOLS_KEEP_ALIVE=${TOOLS_KEEP_ALIVE:--1}
      - CHAT_NUM_CTX=${CHAT_NUM_CTX:-16384}
      - MAX_MODEL=${MAX_MODEL:-}
      - MAX_NUM_CTX=${MAX_NUM_CTX:-16384}
      - MAX_KEEP_ALIVE=${MAX_KEEP_ALIVE:-10m}
      # Binds inside the container only. Exposure is controlled by port
      # publishing: the assistant service publishes NO ports; Caddy is the
      # single published surface (127.0.0.1:8444). Loopback-in-container would
      # break Caddy's appnet proxy.
      - BACKEND_HOST=0.0.0.0
      - SEARCH_BASE_URL=http://searxng:8080
      - BRAVE_ENABLED=${BRAVE_ENABLED:-false}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - DAILY_TASKS_TIME=${DAILY_TASKS_TIME:-09:00}
      - DAILY_TASKS_TZ=${DAILY_TASKS_TZ:-}
      - TZ=${TZ:-}
      # Tool calling: enables list_files, read_file, web_search, etc.
      - TOOLS_ENABLED=${TOOLS_ENABLED:-false}
    volumes:
      - assistant-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # $${...} = expanded at RUNTIME inside the container (container env wins);
    # a host-side .env value can no longer silently override the bind.
    command: ["sh", "-c", "uvicorn assistant.backend.main:app --host $${BACKEND_HOST:-0.0.0.0} --port 8000"]
    # The healthcheck is the image's (see Dockerfile), which probes /healthz —
    # liveness only, no Ollama dependency. autoheal uses that status.
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - appnet

  # Docker restarts a container when its process *exits*, never when it is merely
  # unhealthy — a wedged process is invisible to the restart policy. autoheal
  # watches health status and restarts the unhealthy. It reads the Docker socket,
  # which is why it is a separate small container rather than baked into the app.
  #
  # Scoped by label, not `all`: this host runs other stacks, and AUTOHEAL_*=`all`
  # would restart any unhealthy container on the machine. Only containers that
  # opt in with `autoheal=true` are touched.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal-prod
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging: *default-logging
    networks:
      - appnet

  caddy:
    image: caddy:alpine
    container_name: caddy-prod
    ports:
      - "127.0.0.1:8444:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - ./.data/caddy:/etc/caddy/certs
      - caddy-data:/data
    # Wait for the backend to answer, not merely to start: Caddy would otherwise
    # proxy to a half-booted app on the first requests after a rebuild.
    depends_on:
      assistant:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - appnet

  cli:
    build: .
    container_name: assistant-cli
    environment:
      - ASSISTANT_BACKEND=http://assistant-backend:8000
    depends_on:
      - assistant
    volumes:
      - assistant-data:/app/data:ro
    entrypoint: ["python", "-m", "assistant.cli.app"]
    command: ["status"]
    restart: "no"
    profiles:
      - cli
    networks:
      - appnet

  searxng:
    image: searxng/searxng:latest
    container_name: searxng-prod
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081
      # REQUIRED (see docker-compose.yml): never a shell-generated secret.
      - "SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET is required; generate with: openssl rand -base64 32}"
      - FORCE_OWNERSHIP=false
    volumes:
      - ./searxng:/etc/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  assistant-data:
    driver: local
  caddy-data:
    driver: local
